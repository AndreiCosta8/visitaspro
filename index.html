<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VisitasPRO">
<title>VisitasPRO</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
input,select,textarea,button{font-family:inherit;}

/* ══ TOKENS ══════════════════════════════════════════════ */
:root{
  --f-display:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* verde-mata (marca) */
  --green:#1E8A66;--gd:#0D5A42;--gl:#E0EDE5;--gm:#A9CDB9;
  /* semânticos das visitas */
  --blue-bg:#E3EDF8;--blue:#2A63A8;--blue-b:#B7CDE8;
  --red-bg:#F7E4E1;--red:#A93A34;--red-b:#E9BDB8;
  --amb-bg:#F6EAC9;--amb:#8A5A0B;--amb-b:#E4C57A;
  --grbg:#DDEDE3;--grc:#1F6B4C;--grbb:#B2D3BF;
  --c-real:#1E8A66;--c-agen:#3F7CC8;--c-atra:#D99A1E;--c-canc:#C9524B;
  /* superfícies */
  --bdr:#DAE2DB;--card:#FBFCFA;--txt:#17302A;--muted:#5C7067;
  --bg:#EBF0EA;--inp:#F1F5EF;--hdr:#FBFCFA;--nav:#FBFCFA;--sidebar:#F6F8F3;
  --shadow:0 1px 0 rgba(23,48,42,.04);
  /* painel escuro + amarelo de EPI (único acento) */
  --ink:#17302A;--on-ink:#EAF3EC;--hivis:#F2B21C;--hivis-ink:#3A2A00;
}
body.dark{
  --bdr:#28372F;--card:#16221D;--txt:#E6EFE9;--muted:#8FA59A;
  --bg:#0F1815;--inp:#1C2A24;--hdr:#121D19;--nav:#121D19;--sidebar:#111B17;
  --shadow:none;
  --green:#34B58A;--gd:#8FE0BC;--gl:#173428;--gm:#245240;
  --blue-bg:#1B2E45;--blue:#86B6EE;--blue-b:#2C4A6E;
  --red-bg:#3A1F1D;--red:#F09A94;--red-b:#5C302D;
  --amb-bg:#38290C;--amb:#F0BE5A;--amb-b:#5A4216;
  --grbg:#17372A;--grc:#79D8A8;--grbb:#24523D;
  --c-real:#34B58A;--c-agen:#5E9BE0;--c-atra:#E2A93A;--c-canc:#E07670;
  --ink:#1D4034;--on-ink:#E9F4EE;
}
body{font-family:var(--f-body);background:var(--bg);color:var(--txt);}

/* ══ LOADING ══════════════════════════════════════════════ */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--gl);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ══ TOAST ════════════════════════════════════════════════ */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--ink);color:var(--on-ink);border-radius:14px;padding:12px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:10px;max-width:320px;pointer-events:all;animation:toastIn .25s ease;transition:opacity .3s,transform .3s;}
.toast.out{opacity:0;transform:translateX(20px);}
.toast-icon{font-size:15px;flex-shrink:0;font-weight:700;}
.toast.ok .toast-icon{color:#6FE0B0;}
.toast.err .toast-icon{color:#FF9A93;}
.toast.warn .toast-icon{color:var(--hivis);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ══ MODAL ════════════════════════════════════════════════ */
#modal-overlay{position:fixed;inset:0;background:rgba(10,20,16,.55);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px;}
#modal-overlay.show{display:flex;}
#modal-box{background:var(--card);border-radius:24px 24px 24px 8px;padding:24px;max-width:360px;width:100%;}
#modal-title{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--txt);margin-bottom:8px;}
#modal-msg{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
#modal-actions{display:flex;gap:8px;}
#modal-actions button{flex:1;padding:11px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;border:none;}
#modal-cancel{background:var(--inp);color:var(--muted);}
#modal-confirm{background:var(--red-bg);color:var(--red);}

/* ══ TELAS ════════════════════════════════════════════════ */
.screen{display:none;animation:fadeIn .16s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.ic{width:20px;height:20px;flex-shrink:0;}

/* ══ BADGES ═══════════════════════════════════════════════ */
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;}
.badge-Realizada{background:var(--grbg);color:var(--grc);border-color:var(--grbb);}
.badge-Agendada{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b);}
.badge-Cancelada{background:var(--red-bg);color:var(--red);border-color:var(--red-b);}
.badge-Atrasada{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-b);}

/* ══ BOTÕES ═══════════════════════════════════════════════ */
.btn{width:100%;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;cursor:pointer;border:none;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;}
.btn:active{opacity:.85;transform:scale(.98);}
.btn-primary{background:var(--green);color:#fff;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b)!important;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--bdr)!important;}
.btn-wa{background:#1FA855;color:#fff;}
.btn-exp{background:var(--gd);color:#fff;}
body.dark .btn-exp{background:var(--gl);color:var(--gd);}
.btn-dup{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)!important;}
.btn-icon{width:38px;height:38px;border-radius:50%;padding:0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.btn-add{background:var(--green);color:#fff;}
.icon-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--bdr);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:hover{background:var(--inp);color:var(--txt);}

/* ══ FORMULÁRIOS ══════════════════════════════════════════ */
.lbl{font-size:12px;font-weight:500;color:var(--muted);display:block;margin:14px 0 5px;}
.inp{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--bdr);background:var(--inp);font-size:14px;color:var(--txt);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--green);}
.spills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.spill{padding:7px 15px;border-radius:999px;border:1px solid var(--bdr);background:transparent;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;}
.spill.a-Realizada{background:var(--grbg);color:var(--grc);border-color:var(--grbb);font-weight:600;}
.spill.a-Agendada{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b);font-weight:600;}
.spill.a-Cancelada{background:var(--red-bg);color:var(--red);border-color:var(--red-b);font-weight:600;}
.spill.a-Atrasada{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-b);font-weight:600;}
.frow{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.frow::-webkit-scrollbar{display:none;}
.fpill{flex-shrink:0;padding:5px 13px;border-radius:999px;border:1px solid var(--bdr);background:transparent;font-size:12px;cursor:pointer;color:var(--muted);transition:all .15s;}
.fpill.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink);}

/* ══ MISC ═════════════════════════════════════════════════ */
.sec{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--txt);margin:16px 0 8px;}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:20px;padding:16px;box-shadow:var(--shadow);}
.back-btn{background:none;border:none;color:var(--green);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px;}
.row-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bdr);cursor:pointer;transition:opacity .1s;}
.row-item:active{opacity:.7;}
.row-item.inativo{opacity:.45;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-family:var(--f-display);}
.hist-card{background:var(--inp);border-radius:14px;padding:10px 13px;margin-bottom:6px;}
.prog-wrap{height:6px;background:var(--gl);border-radius:999px;margin-top:4px;overflow:hidden;}
.prog-bar{height:6px;background:var(--green);border-radius:999px;transition:width .4s ease;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0;}
.sync-dot.ok{background:#1E8A66;}.sync-dot.sy{background:#F2B21C;}.sync-dot.er{background:#D9534F;}
.next-chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid var(--blue-b);border-radius:12px;padding:8px 13px;font-size:12px;color:var(--blue);margin-bottom:12px;}
.dias-badge{font-size:10px;border-radius:999px;padding:2px 8px;font-weight:600;white-space:nowrap;}
.dias-ok{background:var(--grbg);color:var(--grc);}
.dias-warn{background:var(--amb-bg);color:var(--amb);}
.dias-danger{background:var(--red-bg);color:var(--red);}
.dias-new{background:var(--blue-bg);color:var(--blue);}
.qa-btn{font-size:11px;padding:4px 10px;border-radius:999px;border:none;cursor:pointer;background:var(--grbg);color:var(--grc);font-weight:600;transition:opacity .15s;display:inline-flex;align-items:center;gap:3px;}
.qa-btn:hover{opacity:.8;}
.kb-card.overdue{border:2px solid var(--amb);}
.kb-card.overdue .kb-client::before{content:'⚠ ';font-size:11px;color:var(--amb);}
.overdue-tag{font-size:9px;font-weight:700;color:var(--amb);background:var(--amb-bg);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:middle;}
.sort-sel{padding:6px 11px;border-radius:12px;border:1px solid var(--bdr);background:var(--inp);font-size:12px;color:var(--muted);cursor:pointer;outline:none;}
.page-title{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--txt);}
:focus-visible{outline:2px solid var(--green);outline-offset:2px;}
.inp:focus-visible{outline:none;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ══ MARCA / NAVEGAÇÃO ════════════════════════════════════ */
.sb-mark{width:38px;height:38px;border-radius:12px 12px 12px 4px;background:var(--ink);color:var(--hivis);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.sb-mark.sm{width:32px;height:32px;}
.sb-logo-txt{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--txt);line-height:1;}
.sb-logo-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.sync{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-left:auto;}

/* ══ PAINEL INÍCIO ════════════════════════════════════════ */
.dash-head{margin-bottom:18px;}
.dash-date{font-size:13px;color:var(--muted);}
.dash-date::first-letter{text-transform:uppercase;}
.dash-hello{font-family:var(--f-display);font-size:36px;font-weight:600;line-height:1.05;letter-spacing:-.01em;color:var(--txt);margin-top:2px;}
.dash-main,.dash-rail,.dash-m{display:flex;flex-direction:column;min-width:0;}
.dash-main,.dash-m{gap:20px;}
.dash-rail{gap:28px;}
.panel{background:var(--card);border:1px solid var(--bdr);border-radius:28px 28px 28px 8px;padding:20px;}
.panel-ink{background:var(--ink);color:var(--on-ink);border-color:transparent;}
.h2{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.1;color:var(--txt);}
.h2-sub{font-size:12px;color:var(--muted);margin-top:3px;}
.who{flex:1;min-width:0;}
.who b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.who span{display:block;font-size:12px;color:var(--muted);margin-top:1px;}
.who .warn{color:var(--amb);font-weight:500;}
.muted-line{font-size:13px;color:var(--muted);padding:12px 0;}

/* Hoje (painel escuro) */
.today-title{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1.05;}
.today-sub{font-size:13px;opacity:.75;margin-top:6px;}
.today-list{margin-top:16px;}
.today-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.14);cursor:pointer;}
.today-row .who span{color:var(--on-ink);opacity:.7;}
.today-done{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-ink);font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.today-done:hover{background:rgba(255,255,255,.12);}
.today-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
.pill-hivis{background:var(--hivis);color:var(--hivis-ink);border:none;border-radius:999px;padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;}
.pill-hivis:active{transform:scale(.97);}
.pill-late{background:rgba(242,178,28,.16);color:#F7D06E;border:1px solid rgba(242,178,28,.45);border-radius:999px;padding:10px 16px;font-weight:600;font-size:13px;cursor:pointer;}
.pill-small{background:transparent;color:var(--gd);border:1px solid var(--gm);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.pill-small:hover{background:var(--gl);}
.pill-solid{background:var(--green);color:#fff;border:none;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;margin-top:10px;}

/* Diário do mês (calendário) */
.diary-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
.diary-month{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1;}
.diary-month::first-letter{text-transform:uppercase;}
.diary-nav{display:flex;gap:6px;}
.goal{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.goal-txt{font-size:13px;color:var(--muted);}
.goal-txt b{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--txt);margin-right:2px;}
.goal-in{width:54px;padding:4px 6px;border-radius:10px;border:1px solid var(--bdr);background:var(--inp);color:var(--txt);text-align:center;font-weight:600;font-size:13px;outline:none;}
.goal-in:focus{border-color:var(--green);}
.goal-bar{flex:1;min-width:110px;display:flex;align-items:center;gap:8px;}
.goal-track{flex:1;height:8px;border-radius:999px;background:var(--gl);overflow:hidden;}
.goal-fill{height:100%;border-radius:999px;transition:width .4s ease;}
.goal-pct{font-size:12px;font-weight:600;min-width:32px;text-align:right;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-h{font-size:11px;color:var(--muted);text-align:center;padding:0 0 6px;}
.cal-d{position:relative;min-height:46px;border-radius:14px;border:none;background:transparent;color:var(--txt);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:5px;font-size:13px;font-weight:500;}
.cal-d:hover{background:var(--inp);}
.cal-d.we{color:var(--muted);}
.cal-d.today{box-shadow:inset 0 0 0 2px var(--hivis);font-weight:700;color:var(--txt);}
.cal-d.sel{background:var(--gl);}
.cal-d.empty{visibility:hidden;pointer-events:none;}
.cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:78%;min-height:6px;}
.cal-dots i,.d-Realizada,.d-Agendada,.d-Atrasada,.d-Cancelada{display:inline-block;width:6px;height:6px;border-radius:50%;}
.cal-more{font-size:9px;font-style:normal;color:var(--muted);line-height:6px;}
.d-Realizada{background:var(--c-real);}.d-Agendada{background:var(--c-agen);}.d-Atrasada{background:var(--c-atra);}.d-Cancelada{background:var(--c-canc);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--muted);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.day-box{margin-top:16px;padding-top:14px;border-top:1px solid var(--bdr);}
.day-box .h2{font-size:18px;}
.day-empty{font-size:13px;color:var(--muted);padding:10px 0 0;}

/* Linhas planas (listas sem cartão) */
.rowf{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--bdr);cursor:pointer;}
.rowf:first-of-type{border-top:none;}
.datechip{width:42px;text-align:center;flex-shrink:0;}
.datechip b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1;color:var(--txt);}
.datechip span{font-size:11px;color:var(--muted);}
.rail-sec{min-width:0;}
.rail-sec .h2{margin-bottom:6px;}

/* 12 meses */
.ribbon{display:flex;height:14px;border-radius:999px;overflow:hidden;gap:2px;background:var(--inp);margin-top:14px;}
.ribbon i{display:block;height:100%;min-width:6px;}
.rb-Realizada{background:var(--c-real);}.rb-Agendada{background:var(--c-agen);}.rb-Atrasada{background:var(--c-atra);}.rb-Cancelada{background:var(--c-canc);}
.rib-legend{display:flex;gap:6px 18px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted);}
.rib-legend span{display:inline-flex;align-items:center;gap:6px;}
.rib-legend b{font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--txt);}
.chart{margin-top:18px;}
.chart svg{width:100%;height:auto;display:block;overflow:visible;}
.b-Realizada{fill:var(--c-real);}.b-Agendada{fill:var(--c-agen);}.b-Atrasada{fill:var(--c-atra);}.b-Cancelada{fill:var(--c-canc);}
.b-empty{fill:var(--bdr);}
.ch-lbl{fill:var(--muted);font-size:10px;font-family:var(--f-body);}
.ch-cur{fill:var(--txt);font-weight:700;}
.ch-val{fill:var(--txt);font-size:10px;font-weight:600;font-family:var(--f-body);}
.ch-goal{stroke:var(--amb);stroke-width:1.5;stroke-dasharray:5 4;}
.ch-goal-t{fill:var(--amb);font-size:10px;font-weight:600;font-family:var(--f-body);}

/* Formulários, listas, relatório */
.form-title{font-family:var(--f-display);font-size:30px;font-weight:600;line-height:1.1;color:var(--txt);margin-bottom:4px;}
.form-sub{font-size:13px;color:var(--muted);margin-bottom:8px;}
.qd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.f-hint{font-size:12px;color:var(--muted);margin-top:6px;}
.f-hint b{color:var(--txt);font-weight:600;}
.vbar{display:flex;flex-direction:column;gap:10px;align-items:stretch!important;}
.vf-row{display:flex;gap:8px;}
.vf-row .inp{flex:1;min-width:0;}
.vf-row .sort-sel{flex-shrink:0;}
.link-btn{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;cursor:pointer;}
.vwrap{padding:0;}
.vcount{font-size:12px;color:var(--muted);padding:12px 0 4px;}
.mgroup{font-family:var(--f-display);font-size:21px;font-weight:600;padding:18px 0 2px;color:var(--txt);}
.mgroup::first-letter{text-transform:uppercase;}
.mgroup span{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted);margin-left:8px;}

/* ══ TOAST ═══════════════════════════════════════════════════ */
function toast(msg,type='ok',dur=3000,act){
  const icons={ok:'✓',err:'✕',warn:'⚠'};
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  const ic=document.createElement('span');ic.className='toast-icon';ic.textContent=icons[type]||'ℹ';
  const tx=document.createElement('span');tx.textContent=msg;
  t.append(ic,tx);
  if(act){
    const b=document.createElement('button');b.className='toast-act';b.textContent=act.label;
    b.onclick=()=>{act.fn();t.remove();};
    t.append(b);dur=Math.max(dur,7000);
  }
  w.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);},dur);
}

/* ══ MODAL CONFIRM ═══════════════════════════════════════════ */
let _modalCb=null;
function modalConfirm(title,msg,cb,btnLabel='Excluir'){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-msg').textContent=msg;
  document.getElementById('modal-confirm').textContent=btnLabel;
  document.getElementById('modal-overlay').classList.add('show');
  _modalCb=cb;
  document.getElementById('modal-confirm').onclick=()=>{modalClose();cb();};
}
function modalClose(){document.getElementById('modal-overlay').classList.remove('show');_modalCb=null;}

/* ══ DARK MODE ═══════════════════════════════════════════════ */
function applyDark(){
  document.body.classList.toggle('dark',dark);
  ['dark-btn','dark-btn-mob'].forEach(id=>{const b=document.getElementById(id);if(b)b.innerHTML=dark?ICON.sun:ICON.moon;b.setAttribute('aria-label',dark?'Usar tema claro':'Usar tema escuro');});
}
function toggleDark(){dark=!dark;localStorage.setItem('vp_dark',dark?'1':'0');applyDark();}

function setSyncs(s){['sync-dot','sync-dot-mob','sync-dot-d'].forEach(id=>{const d=document.getElementById(id);if(d){d.className='sync-dot '+s;}});const tx=document.getElementById('sync-txt');if(tx)tx.textContent={ok:'Sincronizado',sy:'Salvando…',er:'Sem conexão'}[s]||'';}

/* ══ FIREBASE ════════════════════════════════════════════════ */
function o2a(o){return o?Object.values(o).filter(x=>x&&x.id!=null).sort((a,b)=>a.id-b.id):[];}
function a2o(a){const o={};a.forEach(x=>o[x.id]=x);return o;}
/* Toda gravação é feita por registro (visits/ID), nunca sobrescrevendo a coleção inteira */
function fbOp(p){setSyncs('sy');return p.then(()=>setSyncs('ok')).catch(()=>{setSyncs('er');toast('Erro ao salvar — verifique a conexão','err');});}
/* ID novo baseado na data/hora: dois aparelhos não geram o mesmo ID */
function newId(list){let id=Date.now();while(list.some(x=>x.id===id))id++;return id;}

/* ══ UTILS ═══════════════════════════════════════════════════ */
function fd(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function ini(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
/* datas no fuso local (antes usava UTC e virava "amanhã" depois das 21h) */
function td(){return ymd(new Date());}
function tm(){const d=new Date();d.setDate(d.getDate()+1);return ymd(d);}
function dayDiff(a,b){const[ya,ma,da]=a.split('-').map(Number),[yb,mb,dd]=b.split('-').map(Number);return Math.round((Date.UTC(yb,mb-1,dd)-Date.UTC(ya,ma-1,da))/86400000);}
/* critério único: visita Agendada com data passada é Atrasada, em toda a tela */
function effStatus(v){return v.status==='Agendada'&&v.data<td()?'Atrasada':v.status;}
/* taxa de realização = realizadas ÷ visitas que já deveriam ter ocorrido (não conta agendadas futuras) */
function taxaReal(list){const base=list.filter(v=>effStatus(v)!=='Agendada');return base.length?Math.round(base.filter(v=>v.status==='Realizada').length/base.length*100):0;}
function greet(){const h=new Date().getHours();return h<12?'Bom dia':h<18?'Boa tarde':'Boa noite';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clrDates(){document.getElementById('v-df').value='';document.getElementById('v-dt').value='';renderVisits();}

/* ══ DIAS SEM VISITA ═════════════════════════════════════════ */
function diasSemVisita(clienteNome){
  const cvs=visits.filter(v=>v.cliente===clienteNome&&v.status==='Realizada');
  if(!cvs.length)return null; // nunca visitado
  const last=cvs.sort((a,b)=>b.data.localeCompare(a.data))[0].data;
  return Math.max(0,dayDiff(last,td()));
}
function diasBadge(clienteNome){
  const d=diasSemVisita(clienteNome);
  if(d===null)return`<span class="dias-badge dias-new">Nunca visitado</span>`;
  if(d<=15)return`<span class="dias-badge dias-ok">Visitado há ${d}d</span>`;
  if(d<=30)return`<span class="dias-badge dias-warn">${d}d sem visita</span>`;
  return`<span class="dias-badge dias-danger">${d}d sem visita ⚠</span>`;
}

/* ══ NOTIFICAÇÕES ════════════════════════════════════════════ */
function reqNotif(){try{if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}catch(e){}}
function notify(title,body){
  try{if('Notification'in window&&Notification.permission==='granted'){new Notification(title,{body});return true;}}catch(e){}
  return false;
}
function checkNotifs(){
  const t=td(),to=tm();
  const tv=visits.filter(v=>v.data===t&&v.status==='Agendada');
  const mv=visits.filter(v=>v.data===to&&v.status==='Agendada');
  let al={};try{al=JSON.parse(localStorage.getItem('vp_al')||'{}');}catch(e){}
  // guarda só os avisos de hoje/amanhã (antes o registro crescia para sempre)
  const keep={};Object.keys(al).forEach(k=>{if(k==='t'+t||k==='m'+to||k==='t'+to)keep[k]=1;});al=keep;
  if(tv.length&&!al['t'+t]&&notify('📅 Visitas hoje!',tv.map(v=>v.cliente).join(', ')))al['t'+t]=1;
  if(mv.length&&!al['m'+to]&&notify('🔔 Visitas amanhã!',mv.map(v=>v.cliente).join(', ')))al['m'+to]=1;
  try{localStorage.setItem('vp_al',JSON.stringify(al));}catch(e){}
}

/* ══ META MENSAL ═════════════════════════════════════════════ */
let goal=parseInt(localStorage.getItem('vp_goal')||'0')||0;
/* salva no Firebase (vale para todos os aparelhos); localStorage fica como reserva */
function setGoal(v){goal=parseInt(v)||0;localStorage.setItem('vp_goal',goal||'');try{db.ref('config/metaMensal').set(goal).catch(()=>{});}catch(e){}if(curScreen==='dash')renderDash();}

/* ══ INIT ════════════════════════════════════════════════════ */
function initApp(){
  let vr=false,cr=false;
  const slow=setTimeout(()=>{const m=document.getElementById('loading-msg');if(m)m.textContent='Demorando para conectar… verifique a internet.';},12000);
  function ck(){
    if(!vr||!cr)return;
    clearTimeout(slow);
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    const dt=document.getElementById('d-topbar');if(dt)dt.style.display=isD()?'flex':'none';
    fbOk=true;reqNotif();
    try{checkNotifs();}catch(e){}
    renderDash();updHdr();
  }
  function readErr(){toast('Não foi possível ler os dados — verifique a conexão ou as permissões do banco','err',6000);setSyncs('er');}
  db.ref('.info/connected').on('value',s=>{if(s.val())setSyncs('ok');else if(fbOk)setSyncs('er');});
  db.ref('config/metaMensal').on('value',s=>{if(s.exists()){goal=parseInt(s.val())||0;localStorage.setItem('vp_goal',goal||'');if(fbOk&&curScreen==='dash')renderDash();}},()=>{});
  db.ref('visits').on('value',snap=>{
    const d=snap.val();
    if(d)visits=o2a(d);
    else if(!vr){visits=CONFIG.seedInicial?JSON.parse(JSON.stringify(IV)):[];if(visits.length)db.ref('visits').set(a2o(visits));}
    else visits=[];
    vr=true;updHdr();
    if(fbOk){
      try{checkNotifs();}catch(e){}
      if(curScreen==='dash')renderDash();
      if(curScreen==='visits')renderVisits();
      if(curScreen==='report')renderReport();
      if(curScreen==='cdetail'&&viewCId)showClient(viewCId);
    }
    ck();
  },()=>{vr=true;readErr();ck();});
  db.ref('clients').on('value',snap=>{
    const d=snap.val();
    if(d)clients=o2a(d);
    else if(!cr){clients=CONFIG.seedInicial?JSON.parse(JSON.stringify(IC)):[];if(clients.length)db.ref('clients').set(a2o(clients));}
    else clients=[];
    cr=true;updHdr();
    if(fbOk){
      if(curScreen==='clients')renderClients();
      if(curScreen==='cdetail'&&viewCId){if(clients.some(c=>c.id===viewCId))showClient(viewCId);else goTo('clients');}
      if(curScreen==='dash')renderDash();
    }
    ck();
  },()=>{cr=true;readErr();ck();});
}
function updHdr(){
  const txt=`${visits.length} visitas, ${clients.length} clientes`;
  ['sb-sub','mob-sub'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=txt;});
}

/* ══ NAV ═════════════════════════════════════════════════════ */
function goTo(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+screen).classList.add('active');
  document.querySelectorAll(`[data-tab="${screen}"]`).forEach(b=>b.classList.add('active'));
  curScreen=screen;viewCId=null;
  const titles={dash:'Início',visits:'Visitas',form:'Nova visita',report:'Relatório',clients:'Clientes',cform:'Clientes',cdetail:'Clientes'};
  const pt=document.getElementById('d-page-title');if(pt)pt.textContent=titles[screen]||'';
  if(screen==='dash')renderDash();
  if(screen==='visits')renderVisits();
  if(screen==='report')renderReport();
  if(screen==='clients')renderClients(); // busca e filtro ficam como o usuário deixou
}

/* ══ QUICK STATUS CHANGE ═════════════════════════════════════ */
function quickRealizar(id,ev){
  ev&&ev.stopPropagation();
  const before=(visits.find(v=>v.id===id)||{}).status||'Agendada';
  visits=visits.map(v=>v.id===id?{...v,status:'Realizada'}:v);
  fbOp(db.ref('visits/'+id+'/status').set('Realizada'));
  toast('Visita marcada como realizada','ok',3000,{label:'Desfazer',fn:()=>{
    visits=visits.map(v=>v.id===id?{...v,status:before}:v);
    fbOp(db.ref('visits/'+id+'/status').set(before));
    if(curScreen==='visits')renderVisits();if(curScreen==='dash')renderDash();
  }});
  renderVisits();
  if(curScreen==='dash')renderDash();
  
}

/* ══ DASHBOARD ═══════════════════════════════════════════════ */
function relDay(d){const n=dayDiff(td(),d);return n===1?'amanhã':`em ${n} dias`;}
function calNav(d){calM+=d;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}calSel=null;renderDash();}
function calPick(ds){calSel=calSel===ds?null:ds;renderDash();}
function newVisitOn(ds){renderVF(null,false,{cliente:'',data:ds});}
function dchip(ds){const p=ds.split('-');return `<div class="datechip"><b>${+p[2]}</b><span>${MESES[+p[1]-1]}</span></div>`;}
function rowVisit(v,right){return `<div class="rowf" role="button" tabindex="0" onclick="editVisit(${v.id})">${dchip(v.data)}<div class="who"><b>${esc(v.cliente)}</b><span>${esc(v.atividade)}</span></div>${right||''}</div>`;}

function diaryHtml(){
  const t=td();
  const dim=new Date(calY,calM+1,0).getDate(),lead=new Date(calY,calM,1).getDay();
  const ym=`${calY}-${pad(calM+1)}`;
  const mv=visits.filter(v=>v.data.startsWith(ym));
  const byDay={};mv.forEach(v=>(byDay[v.data]=byDay[v.data]||[]).push(v));
  const real=mv.filter(v=>v.status==='Realizada').length;
  const pct=goal>0?Math.min(Math.round(real/goal*100),100):0;
  const gcol=pct>=100?'var(--c-real)':pct>=70?'var(--c-atra)':'var(--c-canc)';
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span class="cal-d empty"></span>';
  for(let d=1;d<=dim;d++){
    const ds=`${ym}-${pad(d)}`,vs=byDay[ds]||[],dow=(lead+d-1)%7;
    const dots=vs.slice(0,4).map(v=>`<i class="d-${effStatus(v)}"></i>`).join('')+(vs.length>4?`<em class="cal-more">+${vs.length-4}</em>`:'');
    cells+=`<button class="cal-d${dow===0||dow===6?' we':''}${ds===t?' today':''}${ds===calSel?' sel':''}" onclick="calPick('${ds}')" aria-pressed="${ds===calSel}" aria-label="${d} de ${MESES_L[calM]}, ${vs.length} ${vs.length===1?'visita':'visitas'}"><span>${d}</span><span class="cal-dots">${dots}</span></button>`;
  }
  let day='';
  if(calSel){
    const p=calSel.split('-'),vs=visits.filter(v=>v.data===calSel);
    day=`<div class="day-box"><div class="h2">${+p[2]} de ${MESES_L[+p[1]-1]}</div>
      ${vs.length?vs.map(v=>{const s=effStatus(v);return `<div class="rowf" role="button" tabindex="0" onclick="editVisit(${v.id})"><div class="who"><b>${esc(v.cliente)}</b><span>${esc(v.atividade)}</span></div><span class="badge badge-${s}">${s}</span></div>`;}).join(''):'<div class="day-empty">Nenhuma visita neste dia.</div>'}
      <button class="pill-solid" onclick="newVisitOn('${calSel}')">Agendar neste dia</button></div>`;
  }
  return `<section class="panel" aria-label="Calendário de visitas">
    <div class="diary-top">
      <div class="diary-month">${MESES_L[calM]} ${calY}</div>
      <div class="diary-nav"><button class="icon-btn" onclick="calNav(-1)" aria-label="Mês anterior">${ICON.left}</button><button class="icon-btn" onclick="calNav(1)" aria-label="Próximo mês">${ICON.right}</button></div>
    </div>
    <div class="goal">
      <div class="goal-txt"><b>${real}</b> ${real===1?'realizada':'realizadas'} no mês, meta <input class="goal-in" type="number" min="1" max="200" value="${goal||''}" placeholder="–" onchange="setGoal(this.value)" aria-label="Meta mensal de visitas"></div>
      ${goal>0?`<div class="goal-bar"><div class="goal-track"><div class="goal-fill" style="width:${pct}%;background:${gcol}"></div></div><div class="goal-pct">${pct}%</div></div>`:''}
    </div>
    <div class="cal">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${cells}</div>
    <div class="legend">${ORDEM.map(s=>`<span><i class="d-${s}"></i>${s}</span>`).join('')}</div>
    ${day}
  </section>`;
}

function renderDash(){
  const now=new Date(),t=td(),to=tm();
  const first=(CONFIG.usuario||'').split(' ')[0];
  const asc=(a,b)=>a.data.localeCompare(b.data);
  const todayV=visits.filter(v=>v.data===t&&v.status==='Agendada');
  const tomV=visits.filter(v=>v.data===to&&v.status==='Agendada');
  const late=visits.filter(v=>effStatus(v)==='Atrasada');
  const upcoming=visits.filter(v=>v.data>t&&v.status==='Agendada').sort(asc);
  const nextV=upcoming[0];
  const recent=visits.filter(v=>v.status==='Realizada').sort((a,b)=>b.data.localeCompare(a.data)).slice(0,4);
  const silent=clients.filter(c=>{if(c.ativo===false)return false;const d=diasSemVisita(c.nome);return d!==null&&d>=30;}).sort((a,b)=>diasSemVisita(b.nome)-diasSemVisita(a.nome)).slice(0,5);

  const head=`<header class="dash-head"><div class="dash-date">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><h1 class="dash-hello">${greet()}, ${esc(first)}</h1></header>`;

  const tTitle=todayV.length?(todayV.length===1?'1 visita hoje':`${todayV.length} visitas hoje`):'Nenhuma visita hoje';
  const tSub=todayV.length?(tomV.length?`Amanhã: ${tomV.length} ${tomV.length===1?'visita':'visitas'}`:'Nada agendado para amanhã'):(nextV?`Próxima: ${esc(nextV.cliente)}, ${relDay(nextV.data)}`:'Não há visitas agendadas à frente');
  const hero=`<section class="panel panel-ink" aria-label="Hoje">
    <div class="today-title">${tTitle}</div>
    <div class="today-sub">${tSub}</div>
    ${todayV.length?`<div class="today-list">${todayV.map(v=>`<div class="today-row" role="button" tabindex="0" onclick="editVisit(${v.id})"><div class="who"><b>${esc(v.cliente)}</b><span>${esc(v.atividade)}</span></div><button class="today-done" onclick="quickRealizar(${v.id},event)">Marcar realizada</button></div>`).join('')}</div>`:''}
    <div class="today-foot"><button class="pill-hivis" onclick="newVisit()">Agendar visita</button>${late.length?`<button class="pill-late" onclick="showVisits('Atrasada')">${late.length} ${late.length===1?'atrasada':'atrasadas'}</button>`:''}</div>
  </section>`;

  // últimos 12 meses
  const chartData=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const mv=visits.filter(v=>v.data.startsWith(ym));
    const o={label:MESES[d.getMonth()],total:mv.length,cur:i===0};
    ORDEM.forEach(s=>o[s]=mv.filter(v=>effStatus(v)===s).length);
    chartData.push(o);
  }
  const W=isD()?560:330,gap=isD()?10:6,n=12,bw=Math.floor((W-gap*(n-1))/n),plot=112,top=20,H=top+plot+20;
  const maxV=Math.max(...chartData.map(d=>d.total),goal,1);
  let bars='';
  chartData.forEach((d,i)=>{
    const x=i*(bw+gap);let y=top+plot;
    ORDEM.forEach(s=>{const h=d[s]>0?Math.max(Math.round(d[s]/maxV*plot),4):0;if(h){y-=h;bars+=`<rect class="b-${s}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="4"/>`;y-=1.5;}});
    if(d.total>0)bars+=`<text class="ch-val" x="${x+bw/2}" y="${y-3}" text-anchor="middle">${d.total}</text>`;
    else bars+=`<rect class="b-empty" x="${x}" y="${top+plot-2}" width="${bw}" height="2" rx="1"/>`;
    bars+=`<text class="ch-lbl${d.cur?' ch-cur':''}" x="${x+bw/2}" y="${top+plot+14}" text-anchor="middle">${d.label}</text><title>${d.label}: ${d.total} ${d.total===1?'visita':'visitas'}</title>`;
  });
  if(goal>0){const gy=top+plot-Math.round(goal/maxV*plot);bars+=`<line class="ch-goal" x1="0" x2="${W}" y1="${gy}" y2="${gy}"/><text class="ch-goal-t" x="${W}" y="${gy-4}" text-anchor="end">meta ${goal}</text>`;}
  const win=ORDEM.map(s=>chartData.reduce((a,d)=>a+d[s],0));
  const fromS=ymd(new Date(now.getFullYear(),now.getMonth()-11,1)),toS=ymd(new Date(now.getFullYear(),now.getMonth()+1,0));
  const taxa12=taxaReal(visits.filter(v=>v.data>=fromS&&v.data<=toS));
  const twelve=`<section class="panel" aria-label="Últimos 12 meses">
    <div class="h2">Últimos 12 meses</div>
    <div class="h2-sub">${taxa12}% das visitas que já deveriam ter ocorrido foram realizadas</div>
    <div class="ribbon" role="img" aria-label="Proporção de visitas por status">${win.map((c,i)=>c?`<i class="rb-${ORDEM[i]}" style="flex:${c}"></i>`:'').join('')}</div>
    <div class="rib-legend">${win.map((c,i)=>`<span><i class="d-${ORDEM[i]}"></i><b>${c}</b> ${PLURAL[ORDEM[i]]}</span>`).join('')}</div>
    <div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas por mês nos últimos 12 meses">${bars}</svg></div>
  </section>`;

  const sec=(title,sub,body)=>`<section class="rail-sec"><h2 class="h2">${title}</h2>${sub?`<div class="h2-sub">${sub}</div>`:''}${body}</section>`;
  const upH=upcoming.slice(0,5).map(v=>rowVisit(v)).join('')||'<div class="muted-line">Nada agendado à frente.</div>';
  const silH=silent.map(c=>`<div class="rowf" role="button" tabindex="0" onclick="showClient(${c.id})"><div class="who"><b>${esc(c.nome)}</b><span class="warn">${diasSemVisita(c.nome)} dias sem visita</span></div><button class="pill-small" onclick="event.stopPropagation();newVisitFor(${c.id})">Agendar</button></div>`).join('')||'<div class="muted-line">Nenhum cliente ativo esquecido.</div>';
  const recH=recent.map(v=>rowVisit(v)).join('')||'<div class="muted-line">Nenhuma visita realizada ainda.</div>';
  const secUp=sec('Próximas visitas','',upH);
  const secSil=sec('Sem visita há 30 dias ou mais','Clientes ativos que precisam de contato',silH);
  const secRec=sec('Últimas realizadas','',recH);

  document.getElementById('s-dash').innerHTML=isD()
    ?`<div class="dash-wrap">${head}<div class="dash-grid"><div class="dash-main">${hero}${diaryHtml()}${twelve}</div><div class="dash-rail">${secUp}${secSil}${secRec}</div></div></div>`
    :`<div class="dash-m">${head}${hero}${diaryHtml()}${secUp}${secSil}${twelve}${secRec}</div>`;
}

/* ══ VISITS ══════════════════════════════════════════════════ */
function clearVisitFilters(){
  fsf='Todas';fff='Todos';document.getElementById('v-search').value='';
  document.querySelectorAll('#v-ff .fpill').forEach(x=>x.classList.toggle('on',x.dataset.e==='Todos'));
  clrDates();
}
const COLS=['Agendada','Atrasada','Realizada','Cancelada'];
function renderVisits(){
  const sf=document.getElementById('v-sf');
  if(!sf.innerHTML){['Todas',...STS].forEach(s=>{const b=document.createElement('button');b.className='fpill';b.textContent=s;b.dataset.s=s;b.onclick=()=>{fsf=s;renderVisits();};sf.appendChild(b);});}
  const ff=document.getElementById('v-ff');
  if(!ff.innerHTML){['Todos',...EMPS].forEach(e=>{const b=document.createElement('button');b.className='fpill';b.textContent=e;b.dataset.e=e;b.onclick=()=>{fff=e;renderVisits();};ff.appendChild(b);});}
  document.querySelectorAll('#v-sf .fpill').forEach(x=>x.classList.toggle('on',x.dataset.s===fsf));
  document.querySelectorAll('#v-ff .fpill').forEach(x=>x.classList.toggle('on',x.dataset.e===fff));
  const q=(document.getElementById('v-search').value||'').toLowerCase();
  const df=document.getElementById('v-df').value,dt=document.getElementById('v-dt').value;
  const sortBy=(document.getElementById('v-sort')||{value:'date-desc'}).value;
  const sorters={
    'date-desc':(a,b)=>b.data.localeCompare(a.data),
    'date-asc':(a,b)=>a.data.localeCompare(b.data),
    'client-az':(a,b)=>a.cliente.localeCompare(b.cliente),
    'client-za':(a,b)=>b.cliente.localeCompare(a.cliente),
  };
  const filtered=visits.filter(v=>(fsf==='Todas'||effStatus(v)===fsf)&&(fff==='Todos'||v.funcionario===fff)&&(!q||v.cliente.toLowerCase().includes(q)||v.atividade.toLowerCase().includes(q)||(v.obs||'').toLowerCase().includes(q))&&(!df||v.data>=df)&&(!dt||v.data<=dt)).sort(sorters[sortBy]||sorters['date-desc']);
  const body=document.getElementById('v-body');
  const n=filtered.length;
  const count=`<div class="vcount">${n} ${n===1?'visita':'visitas'}</div>`;
  if(!n){body.innerHTML=`<div class="vwrap">${count}<div class="empty">Nenhuma visita com esses filtros.<br><button class="pill-solid" onclick="clearVisitFilters()">Limpar filtros</button></div></div>`;return;}
  const actions=v=>{
    const s=effStatus(v);if(s!=='Agendada'&&s!=='Atrasada')return '';
    return `<button class="qa-btn" onclick="quickRealizar(${v.id},event)">Realizada</button>${s==='Atrasada'?`<button class="qa-btn qa-alt" onclick="event.stopPropagation();editVisit(${v.id})">Reagendar</button>`:''}`;
  };
  if(isD()){
    const byCols={};COLS.forEach(s=>byCols[s]=[]);
    filtered.forEach(v=>{const es=effStatus(v);byCols[es]&&byCols[es].push(v);});
    const cc={Agendada:{hdr:'var(--blue)',cnt:'var(--blue-bg)',b:'var(--blue-b)'},Realizada:{hdr:'var(--grc)',cnt:'var(--grbg)',b:'var(--grbb)'},Cancelada:{hdr:'var(--red)',cnt:'var(--red-bg)',b:'var(--red-b)'},Atrasada:{hdr:'var(--amb)',cnt:'var(--amb-bg)',b:'var(--amb-b)'}};
    let html=`<div class="vwrap">${count}<div class="kanban-board">`;
    COLS.forEach(s=>{
      const c=cc[s],cols=byCols[s];
      html+=`<div class="kb-col"><div class="kb-col-header"><span class="kb-col-title"><i class="d-${s}" style="margin-right:8px"></i>${s}</span><span class="kb-count" style="background:${c.cnt};color:${c.hdr};border-color:${c.b}">${cols.length}</span></div>`;
      if(!cols.length)html+=`<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px 0">Nenhuma</div>`;
      cols.forEach(v=>{
        const obsH=v.obs?`<div class="kb-obs">${esc(v.obs)}</div>`:'';
        const isOverdue=v.status==='Agendada'&&v.data<td();
        const overdueTag=isOverdue?`<span class="overdue-tag">Vencida</span>`:'';
        html+=`<div class="kb-card${isOverdue?' overdue':''}" role="button" tabindex="0" onclick="editVisit(${v.id})">
          <div class="kb-client">${esc(v.cliente)}${overdueTag}</div>
          <div class="kb-act">${esc(v.atividade)}</div>
          ${obsH}
          <div class="kb-meta"><span style="font-size:11px;color:${isOverdue?'var(--amb)':'var(--muted)'};font-weight:${isOverdue?'600':'400'}">${fd(v.data)}</span><div class="kb-actions">${actions(v)}</div></div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`</div></div>`;
    body.innerHTML=html;
  } else {
    const byDate=sortBy.startsWith('date');
    let html=`<div class="vwrap">${count}`,lastYm='';
    filtered.forEach(v=>{
      const s=effStatus(v);
      if(byDate){
        const ym=v.data.slice(0,7);
        if(ym!==lastYm){lastYm=ym;const c=filtered.filter(x=>x.data.startsWith(ym)).length;html+=`<div class="mgroup">${MESES_L[+ym.slice(5)-1]} ${ym.slice(0,4)}<span>${c} ${c===1?'visita':'visitas'}</span></div>`;}
      }
      html+=`<div class="rowf" role="button" tabindex="0" onclick="editVisit(${v.id})">${dchip(v.data)}<div class="who"><b>${esc(v.cliente)}</b><span>${esc(v.atividade)}, ${esc(v.funcionario)}</span>${v.obs?`<span class="obs">${esc(v.obs)}</span>`:''}</div><div class="vr-right"><span class="badge badge-${s}">${s}</span>${actions(v)}</div></div>`;
    });
    body.innerHTML=html+`</div>`;
  }
}

function showVisits(s){fsf=s||'Todas';goTo('visits');}
/* ══ VISIT FORM ══════════════════════════════════════════════ */
function renderVF(v,isDup=false,prefill=null){
  curScreen='form';
  evId=isDup?null:v?v.id:null;
  cfs=v?v.status:'Agendada';
  const isE=!!v&&!isDup;
  const curC=(v||prefill)?(v||prefill).cliente:'';
  // só clientes ativos (+ o da visita, se for inativo/removido) e sem cliente pré-escolhido por engano
  const co=(curC?'':'<option value="" selected>Selecione o cliente…</option>')
    +(curC&&!clients.some(c=>c.nome===curC)?`<option value="${esc(curC)}" selected>${esc(curC)} (empresa removida)</option>`:'')
    +clients.filter(c=>c.ativo!==false||c.nome===curC).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${esc(c.nome)}"${curC===c.nome?' selected':''}>${esc(c.nome)}</option>`).join('');
  const ao=ACTS.map(a=>`<option${(v||prefill)&&(v||prefill).atividade===a?' selected':''}>${esc(a)}</option>`).join('');
  const eo=EMPS.map(e=>`<option${v&&v.funcionario===e?' selected':''}>${esc(e)}</option>`).join('');
  const ph=STS.map(s=>`<button type="button" class="spill${s===cfs?' a-'+s:''}" onclick="setFS('${s}')">${s}</button>`).join('');

    <div class="${w}">

      <label class="lbl">Funcionário</label><select id="f-func" class="inp">${eo}</select>
      <label class="lbl">Cliente</label><select id="f-client" class="inp" onchange="clientHint()">${co}</select>
      <div class="f-hint" id="f-hint"></div>
      <label class="lbl">Atividade</label><select id="f-atv" class="inp">${ao}</select>
      <label class="lbl">Status</label><div class="spills" id="form-pills">${ph}</div>
      ${(isE&&v.status==='Agendada'&&v.data<td())?'<div class="next-chip" style="margin-top:8px;background:var(--amb-bg);border-color:var(--amb-b);color:var(--amb)">A data já passou. Marque como Realizada ou Cancelada, ou escolha uma nova data.</div>':''}
      <label class="lbl">Observações</label><textarea id="f-obs" class="inp" rows="3" placeholder="Anotações sobre a visita">${esc(v?v.obs:'')}</textarea>
      <div style="margin-top:20px">
        <button type="button" class="btn btn-primary" onclick="saveVisit()">${isE?'Salvar alterações':isDup?'Registrar cópia':'Registrar visita'}</button>
        ${isE?`<button type="button" class="btn btn-dup" onclick="renderVF(visits.find(x=>x.id===${v.id}),true)">Duplicar esta visita</button>`:''}
        ${isE?`<button type="button" class="btn btn-danger" onclick="delVisit()">Excluir visita</button>`:''}
        <button type="button" class="btn btn-ghost" onclick="goTo('visits')">Cancelar</button>
      </div>
    </div>`;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-form').classList.add('active');

  document.querySelectorAll('[data-tab="form"]').forEach(b=>b.classList.add('active'));
  const pt=document.getElementById('d-page-title');if(pt)pt.textContent=isE?'Editar visita':'Nova visita';

}
function setQD(n){const d=new Date();d.setDate(d.getDate()+n);document.getElementById('f-data').value=ymd(d);}
function clientHint(){
  const el=document.getElementById('f-hint'),sel=document.getElementById('f-client');if(!el||!sel)return;
  const nome=sel.value;if(!nome){el.innerHTML='';return;}
  const last=visits.filter(v=>v.cliente===nome&&v.status==='Realizada'&&v.id!==evId).sort((a,b)=>b.data.localeCompare(a.data))[0];
  el.innerHTML=last?`Última visita realizada: <b>${fd(last.data)}</b>, ${esc(last.atividade)} (${Math.max(0,dayDiff(last.data,td()))} dias)`:'Nenhuma visita realizada com este cliente ainda.';
}
function setFS(s){cfs=s;document.getElementById('form-pills').innerHTML=STS.map(st=>`<button type="button" class="spill${st===s?' a-'+st:''}" onclick="setFS('${st}')">${st}</button>`).join('');}
function newVisit(){evId=null;renderVF(null);}
function editVisit(id){renderVF(visits.find(x=>x.id===id));}
function saveVisit(){
  const data=document.getElementById('f-data').value;
  const funcionario=document.getElementById('f-func').value;
  const cliente=document.getElementById('f-client').value;
  const atividade=document.getElementById('f-atv').value;
  const obs=document.getElementById('f-obs').value;
  if(!data||!cliente){toast('Preencha a data e o cliente','err');return;}
  const wasEdit=!!evId;
  const prev=wasEdit?(visits.find(v=>v.id===evId)||{id:evId}):null;
  const rec=wasEdit?{...prev,data,funcionario,cliente,atividade,status:cfs,obs}:{id:newId(visits),data,funcionario,cliente,atividade,status:cfs,obs};
  visits=wasEdit?visits.map(v=>v.id===rec.id?rec:v).concat(visits.some(v=>v.id===rec.id)?[]:[rec]):[...visits,rec];
  fbOp(db.ref('visits/'+rec.id).set(rec));
  const RT=CONFIG.retornoTeste;
  const offer=RT&&cfs==='Realizada'&&atividade===RT.quando&&ACTS.includes(RT.retorno)&&!visits.some(v=>v.cliente===cliente&&v.status==='Agendada'&&v.atividade===RT.retorno&&v.data>=td());
  const act=offer?{label:'Agendar retorno',fn:()=>{const d=new Date();d.setDate(d.getDate()+RT.dias);renderVF(null,false,{cliente,data:ymd(d),atividade:RT.retorno});}}:undefined;
  toast(wasEdit?'Visita atualizada!':'Visita registrada!','ok',3000,act);
  evId=null;goTo('visits');
}
function delVisit(){
  const idDel=evId;
  modalConfirm('Excluir visita','A visita sai da lista. Você poderá desfazer logo depois.',()=>{
    const bak=visits.find(v=>v.id===idDel);
    visits=visits.filter(v=>v.id!==idDel);
    fbOp(db.ref('visits/'+idDel).remove());
    toast('Visita excluída','warn',3000,bak?{label:'Desfazer',fn:()=>{visits=[...visits,bak];fbOp(db.ref('visits/'+bak.id).set(bak));toast('Visita restaurada','ok');if(curScreen==='visits')renderVisits();}}:undefined);
    evId=null;goTo('visits');
  });
}

/* ══ TOGGLE ATIVO/INATIVO ════════════════════════════════════ */
let cAtivoFilter='ativos'; // 'todos' | 'ativos' | 'inativos'
function toggleAtivo(id,ev){
  ev&&ev.stopPropagation();
  const c=clients.find(x=>x.id===id);if(!c)return;
  const novoEstado=c.ativo===false?true:false;
  // Atualiza localmente primeiro (resposta imediata na tela)
  clients=clients.map(x=>x.id===id?{...x,ativo:novoEstado}:x);
  // Salva apenas o campo 'ativo' deste cliente (atômico — evita sobrescrita)
  setSyncs('sy');
  db.ref('clients/'+id+'/ativo').set(novoEstado)
    .then(()=>setSyncs('ok'))
    .catch(()=>{setSyncs('er');toast('Erro ao salvar — verifique a conexão','err');});
  toast(novoEstado?`${c.nome} marcado como Ativo`:`${c.nome} marcado como Inativo`,novoEstado?'ok':'warn');
  if(curScreen==='cdetail'&&viewCId)showClient(viewCId);else renderClients();
}

function renderClients(){
  const af=document.getElementById('c-ativo-filters');
  if(af&&!af.innerHTML){
    [['ativos','Ativos'],['todos','Todos'],['inativos','Inativos']].forEach(([val,lbl])=>{
      const b=document.createElement('button');
      b.className='fpill'+(val===cAtivoFilter?' on':'');
      b.textContent=lbl;b.dataset.v=val;
      b.onclick=()=>{cAtivoFilter=val;document.querySelectorAll('#c-ativo-filters .fpill').forEach(x=>x.classList.toggle('on',x.dataset.v===val));renderClients();};
      af.appendChild(b);
    });
  }
  const q=(document.getElementById('c-search').value||'').toLowerCase();
  const allFiltered=clients.filter(c=>!q||c.nome.toLowerCase().includes(q)||(c.responsavel||'').toLowerCase().includes(q));
  const filtered=allFiltered.filter(c=>{
    const isAtivo=c.ativo!==false;
    if(cAtivoFilter==='ativos')return isAtivo;
    if(cAtivoFilter==='inativos')return!isAtivo;
    return true;
  }).sort((a,b)=>{
    const aA=a.ativo!==false,bA=b.ativo!==false;
    if(aA&&!bA)return-1;if(!aA&&bA)return 1;
    return a.nome.localeCompare(b.nome);
  });
  const ativos=clients.filter(c=>c.ativo!==false).length;
  const inativos=clients.length-ativos;
  document.getElementById('c-count').textContent=`${filtered.length} exibidas, ${ativos} ativas, ${inativos} inativas`;
  const body=document.getElementById('c-body');
  if(!filtered.length){body.innerHTML='<div class="empty">Nenhuma empresa encontrada.</div>';return;}
  const waNum=c=>String(c.telefone||'').replace(/\D/g,'');
  if(isD()){
    let html='<div class="c-grid">';
    filtered.forEach(c=>{
      const isAtivo=c.ativo!==false;
      const hasWA=waNum(c).length>=10;
      const vCount=visits.filter(v=>v.cliente===c.nome).length;
      const nextV=visits.filter(v=>v.cliente===c.nome&&v.data>=td()&&v.status==='Agendada').sort((a,b)=>a.data.localeCompare(b.data))[0];
      html+=`<div class="c-card${isAtivo?'':' inativo'}" role="button" tabindex="0" onclick="showClient(${c.id})">
        <div style="display:flex;align-items:center;gap:11px;margin-bottom:12px">
          <div class="av" style="width:44px;height:44px;background:${isAtivo?'var(--gl)':'var(--inp)'};color:${isAtivo?'var(--gd)':'var(--muted)'};font-size:16px">${ini(c.nome)}</div>
          <div class="who"><b class="cc-name">${esc(c.nome)}</b><span>${esc(c.responsavel||'Sem responsável')}</span></div>
          <button class="ativo-pill ${isAtivo?'on':'off'}" onclick="toggleAtivo(${c.id},event)" title="${isAtivo?'Marcar como inativo':'Marcar como ativo'}">${isAtivo?'Ativo':'Inativo'}</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
          ${diasBadge(c.nome)}
          ${nextV?`<span style="font-size:11px;color:var(--blue);font-weight:600">Próxima: ${fd(nextV.data)}</span>`:`<span style="font-size:11px;color:var(--muted)">${vCount} ${vCount===1?'visita':'visitas'}</span>`}
          ${hasWA?`<span class="wa-link" onclick="event.stopPropagation();openWA('${waNum(c)}')">WhatsApp</span>`:''}
        </div>
        ${c.obs?`<div style="font-size:11px;color:var(--muted);margin-top:9px;padding:5px 9px;background:var(--inp);border-radius:10px">${esc(c.obs)}</div>`:''}
      </div>`;
    });
    body.innerHTML=html+'</div>';
  } else {
    let html='';
    filtered.forEach(c=>{
      const isAtivo=c.ativo!==false;
      const hasWA=waNum(c).length>=10;
      html+=`<div class="row-item${isAtivo?'':' inativo'}" role="button" tabindex="0" onclick="showClient(${c.id})">
        <div class="av" style="width:42px;height:42px;background:${isAtivo?'var(--gl)':'var(--inp)'};color:${isAtivo?'var(--gd)':'var(--muted)'};font-size:15px">${ini(c.nome)}</div>
        <div class="who"><b>${esc(c.nome)}</b><span style="margin-top:4px">${diasBadge(c.nome)}</span></div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="ativo-pill ${isAtivo?'on':'off'}" onclick="toggleAtivo(${c.id},event)">${isAtivo?'Ativo':'Inativo'}</button>
          ${hasWA?`<span class="wa-link" onclick="event.stopPropagation();openWA('${waNum(c)}')">WA</span>`:''}
          <span style="color:var(--muted)">${ICON.right}</span>
        </div>
      </div>`;
    });
    body.innerHTML=`<div style="padding:0 16px">${html}</div>`;
  }
}

  const w=isD()?'d-form-wrap':'';
  viewCId=id;curScreen='cdetail';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-cdetail').classList.add('active');

      </div>
    </div>`;
  setTimeout(()=>document.getElementById('cf-nome')?.focus(),100);
}
function saveClient(){
  const nome=(document.getElementById('cf-nome').value||'').trim();
  if(!nome){toast('O nome da empresa é obrigatório','err');return;}
  if(clients.some(c=>c.id!==ecId&&c.nome.trim().toLowerCase()===nome.toLowerCase())){toast('Já existe uma empresa com esse nome','err');return;}
  const existing=clients.find(c=>c.id===ecId);
  const cid=ecId||newId(clients);
  const obj={id:cid,nome,responsavel:(document.getElementById('cf-resp').value||'').trim(),telefone:(document.getElementById('cf-tel').value||'').trim(),email:(document.getElementById('cf-email').value||'').trim(),obs:(document.getElementById('cf-obs').value||'').trim(),ativo:existing?existing.ativo!==false:true};
  // Gravação atômica: a empresa e, se o nome mudou, o nome em todas as visitas dela (o histórico não se perde)
  const updates={};updates['clients/'+cid]=obj;
  let moved=0;
  if(existing&&existing.nome!==nome){
    visits.forEach(v=>{if(v.cliente===existing.nome){updates['visits/'+v.id+'/cliente']=nome;moved++;}});
    visits=visits.map(v=>v.cliente===existing.nome?{...v,cliente:nome}:v);
  }
  clients=ecId?clients.map(c=>c.id===ecId?obj:c):[...clients,obj];
  fbOp(db.ref().update(updates));
  toast(ecId?(moved?`Empresa atualizada — ${moved} visita(s) acompanharam o novo nome`:'Empresa atualizada!'):'Empresa cadastrada!','ok');
  ecId=null;
  goTo('clients');
}
function delClient(){
  const idToDel=ecId;
  const cDel=clients.find(c=>c.id===idToDel);
  const nv=cDel?visits.filter(v=>v.cliente===cDel.nome).length:0;
  modalConfirm('Excluir empresa',nv?`${nv} visita(s) continuam no histórico, mas ficam sem empresa cadastrada. Para só parar de visitar, marque a empresa como Inativa.`:'Tem certeza? Esta ação não pode ser desfeita.',()=>{
    clients=clients.filter(c=>c.id!==idToDel);
    // Remove atômico — só este cliente
    setSyncs('sy');
    db.ref('clients/'+idToDel).remove()
      .then(()=>setSyncs('ok'))
      .catch(()=>{setSyncs('er');toast('Erro ao excluir','err');});
    toast('Empresa excluída','warn',3000,cDel?{label:'Desfazer',fn:()=>{clients=[...clients,cDel];fbOp(db.ref('clients/'+cDel.id).set(cDel));toast('Empresa restaurada','ok');if(curScreen==='clients')renderClients();}}:undefined);ecId=null;goTo('clients');
  });
}

/* ══ REPORT ═════════════════════════════════════════════════ */
function setRepMes(m){repMes=m;renderReport();}
function setRepAno(a){repAno=a;renderReport();}
function repRows(){
  const anos=[...new Set(visits.map(v=>v.data.slice(0,4)))].sort((a,b)=>b-a);
  if(!repAno&&anos.length)repAno=anos[0];
  const mi=MESES.indexOf(repMes);
  return visits.filter(v=>v.data.slice(0,4)===repAno&&(repMes==='Todos'||v.data.slice(5,7)===pad(mi+1))).sort((a,b)=>b.data.localeCompare(a.data));
}
/* período anterior: mês anterior (ou o ano anterior, quando "Todos") */
function repPrev(){
  let y=+repAno,m=MESES.indexOf(repMes);
  if(repMes==='Todos')return {rows:visits.filter(v=>v.data.slice(0,4)===String(y-1)),label:String(y-1)};
  m--;if(m<0){m=11;y--;}
  return {rows:visits.filter(v=>v.data.startsWith(`${y}-${pad(m+1)}`)),label:MESES_L[m]};
}
function barRows(entries,color){
  const max=entries.length?entries[0][1]:1,tot=entries.reduce((a,e)=>a+e[1],0)||1;
  return entries.map(([nome,qt])=>`<div class="brow"><div class="brow-top"><span>${esc(nome)}</span><span>${qt} (${Math.round(qt/tot*100)}%)</span></div><div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(qt/max*100)}%;${color?'background:'+color:''}"></div></div></div>`).join('');
}
function group(rows,key){const o={};rows.forEach(v=>o[v[key]]=(o[v[key]]||0)+1);return Object.entries(o).sort((a,b)=>b[1]-a[1]);}
function renderReport(){
  const anos=[...new Set(visits.map(v=>v.data.slice(0,4)))].sort((a,b)=>b-a);
  const rows=repRows();
  const n=rows.length;
  const prev=repPrev();
  const cnt={};ORDEM.forEach(s=>cnt[s]=0);rows.forEach(v=>cnt[effStatus(v)]++);
  const taxa=taxaReal(rows);
  const ocorridas=rows.filter(v=>effStatus(v)!=='Agendada').length;
  const label=repMes==='Todos'?`Ano de ${repAno}`:`${MESES_L[MESES.indexOf(repMes)]} de ${repAno}`;
  const dR=cnt.Realizada-prev.rows.filter(v=>v.status==='Realizada').length;
  const delta=prev.rows.length?`<span class="delta">${dR===0?`Mesmo total de realizadas que ${prev.label}`:`${dR>0?'+':''}${dR} ${Math.abs(dR)===1?'realizada':'realizadas'} em relação a ${prev.label}`}</span>`:'';
  const semVisita=clients.filter(c=>c.ativo!==false&&!rows.some(v=>v.cliente===c.nome&&v.status==='Realizada')).sort((a,b)=>a.nome.localeCompare(b.nome));
  const chips=semVisita.slice(0,14).map(c=>`<span class="chip" role="button" tabindex="0" onclick="showClient(${c.id})">${esc(c.nome)}</span>`).join('')+(semVisita.length>14?`<span class="chip" style="cursor:default;color:var(--muted)">+${semVisita.length-14}</span>`:'');
  const w=isD()?'style="max-width:1000px"':'';
  const head=`<div class="print-only" style="margin-bottom:14px"><b>${esc(CONFIG.appName)}</b>, relatório de ${label}, emitido em ${fd(td())}</div>
    <div class="rep-top">
      <div><div class="form-title" style="margin:0">Relatório</div><div class="form-sub" style="margin:0;text-transform:none">${label.charAt(0).toUpperCase()+label.slice(1)}, ${n} ${n===1?'visita':'visitas'}</div></div>
      <select class="inp no-print" style="width:auto" onchange="setRepAno(this.value)" aria-label="Ano">${anos.map(a=>`<option${a===repAno?' selected':''}>${a}</option>`).join('')}</select>
    </div>
    <div class="rep-mpills no-print">${['Todos',...MESES].map(m=>`<button class="fpill${m===repMes?' on':''}" onclick="setRepMes('${m}')">${m}</button>`).join('')}</div>`;
  if(!n){document.getElementById('s-report').innerHTML=`<div ${w}>${head}<div class="empty">Nenhuma visita neste período.</div></div>`;return;}
  const hero=`<section class="panel panel-ink" aria-label="Taxa de realização">
      <div class="rep-hero-row">
        <div class="rep-hero-num">${taxa}%</div>
        <div style="flex:1;min-width:210px"><div class="today-title" style="font-size:26px">Taxa de realização</div><div class="today-sub">${cnt.Realizada} de ${ocorridas} visitas que já deveriam ter ocorrido</div>${delta}</div>
      </div>
      <div class="ribbon" role="img" aria-label="Proporção de visitas por status">${ORDEM.map(s=>cnt[s]?`<i class="rb-${s}" style="flex:${cnt[s]}"></i>`:'').join('')}</div>
      <div class="rib-legend">${ORDEM.map(s=>`<span><i class="d-${s}"></i><b>${cnt[s]}</b> ${PLURAL[s]}</span>`).join('')}</div>
    </section>`;
  const sec=(t,sub,b)=>`<section class="rep-sec"><h2 class="h2">${t}</h2>${sub?`<div class="h2-sub" style="margin-bottom:12px">${sub}</div>`:'<div style="height:12px"></div>'}${b}</section>`;
  const grid=`<div class="rep-grid">
    ${sec('Clientes mais visitados','',barRows(group(rows,'cliente').slice(0,6)))}
    ${sec('Por tipo de atividade','',barRows(group(rows,'atividade'),'var(--c-agen)'))}
    ${sec('Por funcionário','',barRows(group(rows,'funcionario'),'var(--c-atra)'))}
    ${sec('Sem visita realizada no período',`${semVisita.length} ${semVisita.length===1?'cliente ativo':'clientes ativos'}`,semVisita.length?`<div class="chips" style="margin-top:0">${chips}</div>`:'<div class="muted-line">Todos os clientes ativos foram visitados.</div>')}
  </div>`;
  const actions=`<div class="rep-actions no-print">
      <button class="btn btn-exp" onclick="exportCSV()">Exportar CSV (${n})</button>
      <button class="btn btn-ghost" onclick="window.print()">Imprimir relatório</button>
      <button class="btn btn-ghost" onclick="exportBackup()">Backup completo (JSON)</button>
    </div>`;
  document.getElementById('s-report').innerHTML=`<div ${w}>${head}${hero}${grid}${actions}</div>`;
}
function exportBackup(){
  const data={app:CONFIG.appName,exportadoEm:new Date().toISOString(),visits,clients};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`${CONFIG.appName.toLowerCase()}_backup_${td()}.json`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast(`Backup salvo: ${visits.length} visitas e ${clients.length} clientes`,'ok');
}
function csvCell(s){let t=String(s==null?'':s);if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"';}
function exportCSV(){
  const rows=repRows();
  // ponto e vírgula: o Excel em português abre em colunas; aspas duplicadas preservam o texto das observações
  const head=['Data','Funcionário','Cliente','Atividade','Status','Observações'].join(';');
  const body=rows.map(v=>[fd(v.data),v.funcionario,v.cliente,v.atividade,effStatus(v),v.obs||''].map(csvCell).join(';')).join('\r\n');
  const blob=new Blob(['\uFEFF'+head+'\r\n'+body],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`visitas_${repAno}${repMes!=='Todos'?'_'+repMes:''}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast(`CSV com ${rows.length} visitas exportado!`,'ok');
}

function openWA(tel){window.open(`https://wa.me/55${tel.replace(/\D/g,'')}`, '_blank');}

let resT;window.addEventListener('resize',()=>{clearTimeout(resT);resT=setTimeout(()=>{if(!fbOk)return;const dt=document.getElementById('d-topbar');if(dt)dt.style.display=isD()?'flex':'none';if(curScreen==='dash')renderDash();if(curScreen==='visits')renderVisits();if(curScreen==='clients')renderClients();if(curScreen==='cdetail'&&viewCId)showClient(viewCId);},220);});

/* Enter/Espaço ativam linhas clicáveis (role=button) */
document.addEventListener('keydown',e=>{const t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'){e.preventDefault();t.click();}});
/* Esc fecha a confirmação (e não descarta o formulário por trás) */
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal-overlay').classList.contains('show')){modalClose();e.stopImmediatePropagation();}});
/* ══ KEYBOARD SHORTCUTS (desktop) ════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(!fbOk||!isD())return;
  // Don't fire when typing in inputs
  const tag=(e.target.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag))return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();newVisit();}
  else if(e.key==='/')  {e.preventDefault();const s=document.getElementById('v-search');if(s){goTo('visits');setTimeout(()=>s.focus(),80);}}
  else if(e.key==='1')  goTo('dash');
  else if(e.key==='2')  goTo('visits');
  else if(e.key==='3')  goTo('report');
  else if(e.key==='4')  goTo('clients');
  else if(e.key==='Escape'){if(curScreen==='form'||curScreen==='cform')goTo('visits');}
});

document.title=CONFIG.appName;
document.querySelectorAll('.brand-name').forEach(e=>e.textContent=CONFIG.appName);
document.querySelectorAll('.av-me').forEach(e=>e.textContent=ini(CONFIG.usuario));
buildNav();applyDark();
initApp();
</script>
