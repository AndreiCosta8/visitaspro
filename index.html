<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VisitasPRO">
<title>VisitasPRO</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
input,select,textarea,button{font-family:inherit;}

/* ══ TOKENS ══════════════════════════════════════════════ */
:root{
  --green:#1D9E75;--gd:#0F6E56;--gl:#E1F5EE;--gm:#9FE1CB;
  --blue-bg:#E6F1FB;--blue:#185FA5;--blue-b:#B5D4F4;
  --red-bg:#FCEBEB;--red:#A32D2D;--red-b:#F7C1C1;
  --amb-bg:#FAEEDA;--amb:#854F0B;--amb-b:#FAC775;
  --grbg:#EAF3DE;--grc:#3B6D11;--grbb:#C0DD97;
  --bdr:#e5e7eb;--card:#fff;--txt:#1a1a1a;--muted:#6b7280;
  --bg:#f0f4f1;--inp:#f8faf9;--hdr:#fff;--nav:#fff;--sidebar:#fff;
  --shadow:0 1px 4px rgba(0,0,0,.07);
}
body.dark{
  --bdr:#2d3748;--card:#1e2533;--txt:#f0f4f8;--muted:#94a3b8;
  --bg:#111827;--inp:#273044;--hdr:#161e2e;--nav:#161e2e;--sidebar:#161e2e;
  --shadow:0 1px 4px rgba(0,0,0,.3);
  --blue-bg:#1a2d4a;--blue:#7eb8f7;--blue-b:#2a4a7a;
  --red-bg:#3b1a1a;--red:#f87171;--red-b:#5a2020;
  --amb-bg:#3b2800;--amb:#fbbf24;--amb-b:#5a3a00;
  --grbg:#1a3a26;--grc:#6ee7b7;--grbb:#1f5c38;
  --gl:#1a3a26;--gm:#1f5c38;
}
body{background:var(--bg);color:var(--txt);}

/* ══ LOADING ══════════════════════════════════════════════ */
#loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:14px;}
.spinner{width:36px;height:36px;border:3px solid var(--gl);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ══ TOAST SYSTEM ═════════════════════════════════════════ */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:12px 16px;font-size:13px;color:var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.15);display:flex;align-items:center;gap:10px;max-width:300px;pointer-events:all;animation:toastIn .25s ease;transition:opacity .3s,transform .3s;}
.toast.out{opacity:0;transform:translateX(20px);}
.toast-icon{font-size:16px;flex-shrink:0;}
.toast.ok .toast-icon{color:var(--green);}
.toast.err .toast-icon{color:var(--red);}
.toast.warn .toast-icon{color:var(--amb);}
@keyframes toastIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}

/* ══ CONFIRM MODAL ════════════════════════════════════════ */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:none;align-items:center;justify-content:center;padding:20px;}
#modal-overlay.show{display:flex;}
#modal-box{background:var(--card);border-radius:16px;padding:24px;max-width:340px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.2);}
#modal-title{font-size:16px;font-weight:600;color:var(--txt);margin-bottom:8px;}
#modal-msg{font-size:14px;color:var(--muted);margin-bottom:20px;line-height:1.5;}
#modal-actions{display:flex;gap:8px;}
#modal-actions button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;}
#modal-cancel{background:var(--inp);color:var(--muted);}
#modal-confirm{background:var(--red-bg);color:var(--red);}

/* ══ SCREEN TRANSITIONS ═══════════════════════════════════ */
.screen{display:none;animation:fadeIn .18s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* ══ BADGES ═══════════════════════════════════════════════ */
.badge{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11px;font-weight:500;border:1px solid;white-space:nowrap;}
.badge-Realizada{background:var(--grbg);color:var(--grc);border-color:var(--grbb);}
.badge-Agendada{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b);}
.badge-Cancelada{background:var(--red-bg);color:var(--red);border-color:var(--red-b);}
.badge-Atrasada{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-b);}

/* ══ BUTTONS ══════════════════════════════════════════════ */
.btn{width:100%;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;border:none;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s,transform .1s;}
.btn:active{opacity:.85;transform:scale(.98);}
.btn-primary{background:var(--green);color:#fff;}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b)!important;}
.btn-ghost{background:var(--inp);color:var(--muted);border:1px solid var(--bdr)!important;}
.btn-wa{background:#25D366;color:#fff;}
.btn-exp{background:var(--gd);color:#fff;}
.btn-dup{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-b)!important;}
.btn-icon{width:36px;height:36px;border-radius:50%;padding:0;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.btn-add{background:var(--green);color:#fff;}

/* ══ FORM ELEMENTS ════════════════════════════════════════ */
.lbl{font-size:12px;color:var(--muted);display:block;margin:12px 0 4px;}
.inp{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);font-size:14px;color:var(--txt);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--green);}
.spills{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;}
.spill{padding:6px 14px;border-radius:20px;border:1px solid var(--bdr);background:transparent;font-size:13px;cursor:pointer;color:var(--muted);transition:all .15s;}
.spill.a-Realizada{background:var(--grbg);color:var(--grc);border-color:var(--grbb);font-weight:500;}
.spill.a-Agendada{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-b);font-weight:500;}
.spill.a-Cancelada{background:var(--red-bg);color:var(--red);border-color:var(--red-b);font-weight:500;}
.spill.a-Atrasada{background:var(--amb-bg);color:var(--amb);border-color:var(--amb-b);font-weight:500;}

/* ══ FILTER PILLS ═════════════════════════════════════════ */
.frow{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
.frow::-webkit-scrollbar{display:none;}
.fpill{flex-shrink:0;padding:4px 12px;border-radius:20px;border:1px solid var(--bdr);background:transparent;font-size:11px;cursor:pointer;color:var(--muted);transition:all .15s;}
.fpill.on{background:var(--green);color:#fff;border-color:var(--gd);}

/* ══ MISC ═════════════════════════════════════════════════ */
.sec{font-size:13px;font-weight:500;color:var(--muted);margin:14px 0 8px;}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;}
.card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px;box-shadow:var(--shadow);}
.back-btn{background:none;border:none;color:var(--green);font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px;}
.row-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--bdr);cursor:pointer;transition:opacity .1s;}
.row-item:active{opacity:.7;}
.row-item.inativo{opacity:.45;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.hist-card{background:var(--inp);border-radius:8px;padding:9px 12px;margin-bottom:6px;}
.prog-wrap{height:5px;background:var(--gl);border-radius:3px;margin-top:4px;}
.prog-bar{height:5px;background:var(--green);border-radius:3px;transition:width .4s ease;}
#sync-dot{width:8px;height:8px;border-radius:50%;background:#ccc;transition:background .3s;flex-shrink:0;}
#sync-dot.ok{background:#1D9E75;}#sync-dot.sy{background:#FAC775;}#sync-dot.er{background:#E24B4A;}
.next-chip{display:inline-flex;align-items:center;gap:6px;background:var(--blue-bg);border:1px solid var(--blue-b);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--blue);margin-bottom:12px;}
.dias-badge{font-size:10px;border-radius:6px;padding:2px 7px;font-weight:600;white-space:nowrap;}
.dias-ok{background:var(--grbg);color:var(--grc);}
.dias-warn{background:var(--amb-bg);color:var(--amb);}
.dias-danger{background:var(--red-bg);color:var(--red);}
.dias-new{background:var(--blue-bg);color:var(--blue);}
/* Quick action btn on kanban */
.qa-btn{font-size:10px;padding:3px 8px;border-radius:6px;border:none;cursor:pointer;background:var(--grbg);color:var(--grc);font-weight:500;transition:opacity .15s;display:inline-flex;align-items:center;gap:3px;}
.qa-btn:hover{opacity:.8;}
/* Overdue kanban card */
.kb-card.overdue{border:2px solid var(--amb);}
.kb-card.overdue .kb-client::before{content:'⚠️ ';font-size:11px;}
.overdue-tag{font-size:9px;font-weight:600;color:var(--amb);background:var(--amb-bg);border-radius:4px;padding:1px 5px;margin-left:4px;vertical-align:middle;}
/* Meta sidebar */
.sb-meta-input{width:100%;border:1px solid var(--gm);border-radius:6px;background:transparent;color:var(--gd);font-size:13px;font-weight:600;padding:2px 6px;text-align:center;outline:none;}
.sb-meta-input:focus{border-color:var(--gd);}
/* Silent clients */
.silent-card{background:var(--amb-bg);border:1px solid var(--amb-b);border-radius:10px;padding:9px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.silent-card:hover{opacity:.85;}
/* Sort select */
.sort-sel{padding:5px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);font-size:12px;color:var(--muted);cursor:pointer;outline:none;}
/* Keyboard hint */
.kbd-hint{display:inline-flex;align-items:center;background:var(--inp);border:1px solid var(--bdr);border-radius:5px;padding:1px 5px;font-size:10px;color:var(--muted);font-family:monospace;}

/* ══════════════════════════════════════════════════════════
   MOBILE LAYOUT
══════════════════════════════════════════════════════════ */
@media(max-width:767px){
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  #sidebar{display:none;}
  #topbar{background:var(--hdr);border-bottom:1px solid var(--bdr);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  #content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  #bottomnav{background:var(--nav);border-top:1px solid var(--bdr);display:flex;padding:6px 0 max(8px,env(safe-area-inset-bottom));flex-shrink:0;}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 0;color:var(--muted);border:none;background:none;font-size:9px;}
  .nav-item.active{color:var(--green);}
  .nav-icon{font-size:20px;line-height:1;}
  .screen{padding:16px;}.screen.active{display:block;}
  #s-visits{padding:0;}#s-clients{padding:0;}
  .swrap{padding:10px 16px;border-bottom:1px solid var(--bdr);background:var(--hdr);}
  .lwrap{padding:10px 16px;}
  /* Mobile visit card with left status border */
  .mvisit-card{background:var(--card);border:1px solid var(--bdr);border-left:4px solid;border-radius:12px;padding:13px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);transition:opacity .15s;}
  .mvisit-card:active{opacity:.8;}
  .mvisit-card.s-Realizada{border-left-color:var(--grc);}
  .mvisit-card.s-Agendada{border-left-color:var(--blue);}
  .mvisit-card.s-Cancelada{border-left-color:var(--red);}
  .mvisit-card.s-Atrasada{border-left-color:var(--amb);}
  .drow{display:flex;gap:6px;margin-top:8px;align-items:center;}
  .drow label{font-size:11px;color:var(--muted);flex-shrink:0;}
  .drow input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);font-size:12px;color:var(--txt);}
  .toast{max-width:calc(100vw - 40px);}
  #toast-wrap{top:auto;bottom:80px;right:10px;left:10px;}
  .toast{max-width:100%;}
}

/* ══════════════════════════════════════════════════════════
   DESKTOP LAYOUT
══════════════════════════════════════════════════════════ */
@media(min-width:768px){
  body{min-height:100vh;}
  #app{display:flex;flex-direction:row;height:100vh;overflow:hidden;}
  #bottomnav{display:none;}#topbar{display:none;}
  #sidebar{width:230px;background:var(--sidebar);border-right:1px solid var(--bdr);display:flex;flex-direction:column;flex-shrink:0;padding:20px 0;}
  .sb-logo{padding:0 20px 20px;border-bottom:1px solid var(--bdr);margin-bottom:12px;}
  .sb-logo-txt{font-size:20px;font-weight:700;color:var(--green);}
  .sb-logo-sub{font-size:10px;color:var(--muted);margin-top:2px;}
  .sb-month-box{margin:0 12px 12px;background:var(--gl);border-radius:10px;padding:10px 12px;}
  .sb-month-label{font-size:10px;color:var(--gd);margin-bottom:6px;font-weight:500;}
  .sb-month-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .sb-month-val{font-size:22px;font-weight:700;color:var(--gd);}
  .sb-month-pct{font-size:11px;color:var(--gd);opacity:.7;margin-top:4px;}
  .sb-meta-wrap{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;color:var(--gd);}
  .sb-nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:14px;color:var(--muted);border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent;transition:all .15s;}
  .sb-nav-item:hover{background:var(--inp);color:var(--txt);}
  .sb-nav-item.active{color:var(--green);background:var(--gl);border-left-color:var(--green);font-weight:500;}
  .sb-nav-icon{font-size:17px;width:20px;text-align:center;}
  .sb-bottom{margin-top:auto;padding:12px 20px;border-top:1px solid var(--bdr);display:flex;align-items:center;gap:8px;}
  #content{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
  #d-topbar{background:var(--hdr);border-bottom:1px solid var(--bdr);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
  .screen{padding:28px;}.screen.active{display:block;}
  #s-visits{padding:0;}#s-clients{padding:0;}
  .dash-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:28px;}
  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  .kpi{border-radius:12px;padding:14px;text-align:center;border:1px solid;position:relative;overflow:hidden;}
  .kpi-val{font-size:32px;font-weight:700;}
  .kpi-lbl{font-size:11px;opacity:.85;margin-top:2px;}
  .kpi-pct{font-size:11px;margin-top:6px;padding:2px 8px;border-radius:10px;display:inline-block;}
  .kanban-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;min-width:800px;}
  .kb-col{background:var(--inp);border-radius:12px;padding:12px;}
  .kb-col-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid var(--bdr);}
  .kb-col-title{font-size:13px;font-weight:600;color:var(--txt);}
  .kb-count{font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;border:1px solid;}
  .kb-card{background:var(--card);border:1px solid var(--bdr);border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow);}
  .kb-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
  .kb-client{font-size:13px;font-weight:500;color:var(--txt);margin-bottom:4px;}
  .kb-act{font-size:11px;color:var(--muted);}
  .kb-meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;}
  .kb-obs{font-size:10px;color:var(--muted);margin-top:5px;padding:4px 6px;background:var(--inp);border-radius:5px;border-left:2px solid var(--gm);font-style:italic;}
  .c-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;padding:28px;}
  .c-card{background:var(--card);border:1px solid var(--bdr);border-radius:12px;padding:14px 16px;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow);}
  .c-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.1);}
  .c-card.inativo{opacity:.5;filter:grayscale(.4);}
  .c-card.inativo:hover{transform:none;box-shadow:var(--shadow);}
  /* Ativo/Inativo toggle pill */
  .ativo-pill{font-size:10px;font-weight:600;border-radius:20px;padding:2px 8px;border:1px solid;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0;}
  .ativo-pill.on{background:var(--grbg);color:var(--grc);border-color:var(--grbb);}
  .ativo-pill.off{background:var(--inp);color:var(--muted);border-color:var(--bdr);}
  .d-form-wrap{max-width:580px;margin:0 auto;}
  .swrap{padding:16px 28px;border-bottom:1px solid var(--bdr);background:var(--hdr);display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .swrap input[type=text]{max-width:300px;}
  .drow{display:flex;gap:8px;align-items:center;}
  .drow label{font-size:12px;color:var(--muted);flex-shrink:0;}
  .drow input{padding:8px 10px;border-radius:8px;border:1px solid var(--bdr);background:var(--inp);font-size:13px;color:var(--txt);outline:none;}
  .lwrap{padding:0;}
}
</style>
</head>
<body>

<!-- TOAST -->
<div id="toast-wrap"></div>

<!-- CONFIRM MODAL -->
<div id="modal-overlay">
  <div id="modal-box">
    <div id="modal-title"></div>
    <div id="modal-msg"></div>
    <div id="modal-actions">
      <button id="modal-cancel" onclick="modalClose()">Cancelar</button>
      <button id="modal-confirm">Excluir</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="font-size:16px;font-weight:700;color:var(--green)">VisitasPRO</div>
  <div style="font-size:12px;color:var(--muted)">Conectando ao Firebase...</div>
</div>

<div id="app" style="display:none">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sb-logo">
      <div class="sb-logo-txt">VisitasPRO</div>
      <div class="sb-logo-sub" id="sb-sub">carregando...</div>
    </div>
    <div class="sb-month-box" id="sb-month-box"></div>
    <button class="sb-nav-item active" onclick="goTo('dash')" data-tab="dash"><span class="sb-nav-icon">⊟</span>Dashboard</button>
    <button class="sb-nav-item" onclick="goTo('visits')" data-tab="visits"><span class="sb-nav-icon">☰</span>Visitas</button>
    <button class="sb-nav-item" onclick="newVisit()" data-tab="form"><span class="sb-nav-icon">⊕</span>Nova Visita</button>
    <button class="sb-nav-item" onclick="goTo('report')" data-tab="report"><span class="sb-nav-icon">◈</span>Relatório</button>
    <button class="sb-nav-item" onclick="goTo('clients')" data-tab="clients"><span class="sb-nav-icon">☺</span>Clientes</button>
    <div class="sb-bottom">
      <button onclick="toggleDark()" id="dark-btn" style="background:none;border:1px solid var(--bdr);border-radius:20px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--muted);">🌙 Tema</button>
      <div id="sync-dot" style="margin-left:auto;"></div>
    </div>
  </div>

  <!-- MOBILE TOPBAR -->
  <div id="topbar">
    <div>
      <div style="font-size:17px;font-weight:700;color:var(--green)">VisitasPRO</div>
      <div style="font-size:10px;color:var(--muted)" id="mob-sub">carregando...</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button onclick="toggleDark()" id="dark-btn-mob" style="background:none;border:1px solid var(--bdr);border-radius:20px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted);">🌙</button>

let repAno='',repMes='Todos',fbOk=false;
let dark=localStorage.getItem('vp_dark')==='1';
const isD=()=>window.innerWidth>=768;

/* ══ TOAST ═══════════════════════════════════════════════════ */
function toast(msg,type='ok',dur=3000){
  const icons={ok:'✓',err:'✕',warn:'⚠'};
  const w=document.getElementById('toast-wrap');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<span class="toast-icon">${icons[type]||'ℹ'}</span><span>${msg}</span>`;
  w.appendChild(t);
  setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),350);},dur);
}

/* ══ MODAL CONFIRM ═══════════════════════════════════════════ */
let _modalCb=null;
function modalConfirm(title,msg,cb,btnLabel='Excluir'){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-msg').textContent=msg;
  document.getElementById('modal-confirm').textContent=btnLabel;
  document.getElementById('modal-overlay').classList.add('show');
  _modalCb=cb;
  document.getElementById('modal-confirm').onclick=()=>{modalClose();cb();};
}
function modalClose(){document.getElementById('modal-overlay').classList.remove('show');_modalCb=null;}

/* ══ DARK MODE ═══════════════════════════════════════════════ */
function applyDark(){
  document.body.classList.toggle('dark',dark);
  ['dark-btn','dark-btn-mob'].forEach(id=>{const b=document.getElementById(id);if(b)b.textContent=dark?'☀️ Tema':'🌙 Tema';});
}
function toggleDark(){dark=!dark;localStorage.setItem('vp_dark',dark?'1':'0');applyDark();}
applyDark();

/* ══ SYNC DOTS ═══════════════════════════════════════════════ */
function setSyncs(s){['sync-dot','sync-dot-mob','sync-dot-d'].forEach(id=>{const d=document.getElementById(id);if(d){d.className='';d.classList.add(s);}});}

/* ══ FIREBASE ════════════════════════════════════════════════ */
function o2a(o){return o?Object.values(o).sort((a,b)=>a.id-b.id):[];}
function a2o(a){const o={};a.forEach(x=>o[x.id]=x);return o;}
function svFB(){setSyncs('sy');db.ref('visits').set(a2o(visits)).then(()=>{setSyncs('ok');}).catch(()=>{setSyncs('er');toast('Erro ao sincronizar','err');});}
function scFB(){setSyncs('sy');db.ref('clients').set(a2o(clients)).then(()=>setSyncs('ok')).catch(()=>setSyncs('er'));}
function nvi(){return visits.length?Math.max(...visits.map(v=>v.id))+1:1;}
function nci(){return clients.length?Math.max(...clients.map(c=>c.id))+1:1;}

/* ══ UTILS ═══════════════════════════════════════════════════ */
function fd(d){if(!d)return'';const[y,m,dd]=d.split('-');return`${dd}/${m}/${y}`;}
function ini(n){return(n||'?').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function td(){return new Date().toISOString().split('T')[0];}
function tm(){const d=new Date();d.setDate(d.getDate()+1);return d.toISOString().split('T')[0];}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function clrDates(){document.getElementById('v-df').value='';document.getElementById('v-dt').value='';renderVisits();}

/* ══ DIAS SEM VISITA ═════════════════════════════════════════ */
function diasSemVisita(clienteNome){
  const cvs=visits.filter(v=>v.cliente===clienteNome&&v.status==='Realizada');
  if(!cvs.length)return null; // nunca visitado
  const last=cvs.sort((a,b)=>b.data.localeCompare(a.data))[0].data;
  const diff=Math.floor((new Date(td())- new Date(last))/(1000*60*60*24));
  return diff;
}
function diasBadge(clienteNome){
  const d=diasSemVisita(clienteNome);
  if(d===null)return`<span class="dias-badge dias-new">Nunca visitado</span>`;
  if(d<=15)return`<span class="dias-badge dias-ok">Visitado há ${d}d</span>`;
  if(d<=30)return`<span class="dias-badge dias-warn">${d}d sem visita</span>`;
  return`<span class="dias-badge dias-danger">${d}d sem visita ⚠</span>`;
}

/* ══ NOTIFICAÇÕES ════════════════════════════════════════════ */
function reqNotif(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}
function checkNotifs(){
  const t=td(),to=tm();
  const tv=visits.filter(v=>v.data===t&&v.status==='Agendada');
  const mv=visits.filter(v=>v.data===to&&v.status==='Agendada');
  const al=JSON.parse(localStorage.getItem('vp_al')||'{}');
  if(tv.length&&!al['t'+t]){if(Notification.permission==='granted')new Notification('📅 Visitas hoje!',{body:tv.map(v=>v.cliente).join(', ')});al['t'+t]=1;localStorage.setItem('vp_al',JSON.stringify(al));}
  if(mv.length&&!al['m'+to]){if(Notification.permission==='granted')new Notification('🔔 Visitas amanhã!',{body:mv.map(v=>v.cliente).join(', ')});al['m'+to]=1;localStorage.setItem('vp_al',JSON.stringify(al));}
}

/* ══ SIDEBAR MONTH BOX ═══════════════════════════════════════ */
function updSbMonth(){
  const box=document.getElementById('sb-month-box');if(!box)return;
  const now=new Date();
  const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const mv=visits.filter(v=>v.data.startsWith(ym));
  const real=mv.filter(v=>v.status==='Realizada').length;
  const total=mv.length;
  const goal=parseInt(localStorage.getItem('vp_goal')||'0')||0;
  const pctReal=total>0?Math.round((real/total)*100):0;
  const pctGoal=goal>0?Math.min(Math.round((real/goal)*100),100):0;
  const goalColor=pctGoal>=100?'var(--grc)':pctGoal>=70?'var(--amb)':'var(--red)';
  box.innerHTML=`
    <div class="sb-month-label">${MESES[now.getMonth()]} ${now.getFullYear()}</div>
    <div class="sb-month-row"><span class="sb-month-val">${real}</span><span style="font-size:11px;color:var(--gd);margin-top:8px">realizadas</span></div>
    <div style="font-size:11px;color:var(--gd);margin-bottom:4px">${total} visitas · ${pctReal}% realizado</div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pctReal}%"></div></div>
    <div class="sb-meta-wrap">
      <span>Meta:</span>
      <input class="sb-meta-input" type="number" min="1" max="200" value="${goal||''}" placeholder="–" title="Defina sua meta mensal de visitas"
        style="width:46px;" onchange="setGoal(this.value)" oninput="setGoal(this.value)">
      <span>visitas</span>
    </div>
    ${goal>0?`<div class="prog-wrap" style="margin-top:4px"><div class="prog-bar" style="width:${pctGoal}%;background:${goalColor}"></div></div><div style="font-size:10px;color:${goalColor};margin-top:2px">${real}/${goal} (${pctGoal}%)</div>`:''}`;
}
function setGoal(v){const g=parseInt(v)||0;localStorage.setItem('vp_goal',g||'');updSbMonth();}

/* ══ INIT ════════════════════════════════════════════════════ */
function initApp(){
  let vr=false,cr=false;
  function ck(){
    if(!vr||!cr)return;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='flex';
    const dt=document.getElementById('d-topbar');if(dt)dt.style.display=isD()?'flex':'none';
    fbOk=true;reqNotif();checkNotifs();renderDash();updHdr();updSbMonth();
  }
  db.ref('visits').on('value',snap=>{
    const d=snap.val();
    if(d)visits=o2a(d);
    else if(!vr){visits=JSON.parse(JSON.stringify(IV));db.ref('visits').set(a2o(visits));}
    vr=true;setSyncs('ok');updHdr();updSbMonth();
    if(fbOk){checkNotifs();if(curScreen==='dash')renderDash();if(curScreen==='visits')renderVisits();if(curScreen==='report')renderReport();}
    ck();
  },()=>{vr=true;ck();});
  db.ref('clients').on('value',snap=>{
    const d=snap.val();
    if(d)clients=o2a(d);
    else if(!cr){clients=JSON.parse(JSON.stringify(IC));db.ref('clients').set(a2o(clients));}
    cr=true;updHdr();
    if(fbOk&&curScreen==='clients')renderClients();
    ck();
  },()=>{cr=true;ck();});
}
function updHdr(){
  const txt=`${visits.length} visitas · ${clients.length} clientes`;
  ['sb-sub','mob-sub'].forEach(id=>{const e=document.getElementById(id);if(e)e.textContent=txt;});
}

/* ══ NAV ═════════════════════════════════════════════════════ */
function goTo(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));
  document.getElementById('s-'+screen).classList.add('active');
  document.querySelectorAll(`[data-tab="${screen}"]`).forEach(b=>b.classList.add('active'));
  curScreen=screen;
  const titles={dash:'Dashboard',visits:'Visitas',form:'Nova Visita',report:'Relatório',clients:'Clientes',cform:'Clientes'};
  const pt=document.getElementById('d-page-title');if(pt)pt.textContent=titles[screen]||'';
  if(screen==='dash')renderDash();
  if(screen==='visits')renderVisits();
  if(screen==='report')renderReport();
  if(screen==='clients'){
    const si=document.getElementById('c-search');if(si)si.value='';
    // Reset ativo filter pills so they rebuild
    const af=document.getElementById('c-ativo-filters');if(af)af.innerHTML='';
    cAtivoFilter='ativos';
    renderClients();
  }
}

/* ══ QUICK STATUS CHANGE ═════════════════════════════════════ */
function quickRealizar(id,ev){
  ev&&ev.stopPropagation();
  visits=visits.map(v=>v.id===id?{...v,status:'Realizada'}:v);
  svFB();
  toast('✅ Marcada como Realizada!','ok');
  renderVisits();
  if(curScreen==='dash')renderDash();
  updSbMonth();
}

/* ══ DASHBOARD ═══════════════════════════════════════════════ */
function renderDash(){
  const now=new Date(),t=td(),to=tm();
  const counts={Agendada:0,Realizada:0,Cancelada:0,Atrasada:0};
  visits.forEach(v=>counts[v.status]=(counts[v.status]||0)+1);
  const total=visits.length;
  const taxaR=total>0?Math.round((counts.Realizada/total)*100):0;
  const todayV=visits.filter(v=>v.data===t&&v.status==='Agendada');
  const tomV=visits.filter(v=>v.data===to&&v.status==='Agendada');
  const upcoming=visits.filter(v=>v.data>=t&&v.status==='Agendada').sort((a,b)=>a.data.localeCompare(b.data)).slice(0,5);
  const recent=visits.filter(v=>v.status==='Realizada').sort((a,b)=>b.data.localeCompare(a.data)).slice(0,4);

  // Chart – 12 months stacked
  const chartData=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const ym=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    const mv=visits.filter(v=>v.data.startsWith(ym));
    chartData.push({label:MESES[d.getMonth()],Agendada:mv.filter(v=>v.status==='Agendada').length,Realizada:mv.filter(v=>v.status==='Realizada').length,Cancelada:mv.filter(v=>v.status==='Cancelada').length,Atrasada:mv.filter(v=>v.status==='Atrasada').length,total:mv.length});
  }
  const maxV=Math.max(...chartData.map(d=>d.total),1);
  const bw=isD()?34:22,gap=isD()?8:4,ch=80,svgW=chartData.length*(bw+gap)-gap;
  let bars='';
  chartData.forEach((d,i)=>{
    const x=i*(bw+gap);let y=ch;
    ['Cancelada','Atrasada','Agendada','Realizada'].forEach(s=>{const h=d[s]>0?Math.max(Math.round((d[s]/maxV)*ch),3):0;if(h>0){y-=h;bars+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${colMap[s]}" rx="2"/>`;y-=1;}});
    bars+=`<text x="${x+bw/2}" y="${ch+13}" text-anchor="middle" font-size="9" fill="#6b7280">${d.label}</text>`;
    if(d.total>0)bars+=`<text x="${x+bw/2}" y="${ch-Math.round((d.total/maxV)*ch)-5}" text-anchor="middle" font-size="9" fill="#0F6E56" font-weight="600">${d.total}</text>`;
  });

  // Notif banners
  let notifHtml='';
  if(todayV.length)notifHtml+=`<div style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:10px;padding:10px 14px;margin-bottom:10px;cursor:pointer;" onclick="goTo('visits')"><div style="font-size:12px;font-weight:600;color:var(--red)">📅 ${todayV.length} visita(s) agendada(s) para HOJE</div>${todayV.map(v=>`<div style="font-size:12px;color:var(--red);margin-top:2px">• ${esc(v.cliente)} — ${esc(v.atividade)}</div>`).join('')}</div>`;
  if(tomV.length)notifHtml+=`<div style="background:var(--amb-bg);border:1px solid var(--amb-b);border-radius:10px;padding:10px 14px;margin-bottom:10px;cursor:pointer;" onclick="goTo('visits')"><div style="font-size:12px;font-weight:600;color:var(--amb)">🔔 ${tomV.length} visita(s) para amanhã</div>${tomV.map(v=>`<div style="font-size:12px;color:var(--amb);margin-top:2px">• ${esc(v.cliente)} — ${esc(v.atividade)}</div>`).join('')}</div>`;

  // KPIs com taxa de realização
  const kpiHtml=`
    <div class="kpi-row">
      <div class="kpi" style="background:var(--blue-bg);border-color:var(--blue-b)">
        <div class="kpi-val" style="color:var(--blue)">${counts.Agendada}</div>
        <div class="kpi-lbl" style="color:var(--blue)">Agendadas</div>
      </div>
      <div class="kpi" style="background:var(--grbg);border-color:var(--grbb)">
        <div class="kpi-val" style="color:var(--grc)">${counts.Realizada}</div>
        <div class="kpi-lbl" style="color:var(--grc)">Realizadas</div>
        <div class="kpi-pct" style="background:var(--gl);color:var(--gd)">${taxaR}% de realização</div>
      </div>
      <div class="kpi" style="background:var(--red-bg);border-color:var(--red-b)">
        <div class="kpi-val" style="color:var(--red)">${counts.Cancelada}</div>
        <div class="kpi-lbl" style="color:var(--red)">Canceladas</div>
      </div>
      <div class="kpi" style="background:var(--amb-bg);border-color:var(--amb-b)">
        <div class="kpi-val" style="color:var(--amb)">${counts.Atrasada}</div>
        <div class="kpi-lbl" style="color:var(--amb)">Atrasadas</div>
      </div>
    </div>`;

  const chartCard=`
    <div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
        <span style="font-size:14px;font-weight:600;color:var(--txt)">Visitas por mês — últimos 12 meses</span>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          ${Object.entries(colMap).map(([s,c])=>`<span style="font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></span>${s}</span>`).join('')}
        </div>
      </div>
      <div style="overflow-x:auto"><svg viewBox="0 0 ${svgW} ${ch+20}" width="100%" style="min-width:${isD()?'100%':'360px'};overflow:visible">${bars}</svg></div>
    </div>`;

  let upHtml='';
  if(upcoming.length){upHtml=`<div class="sec">📅 Próximas agendadas</div>`;upcoming.forEach(v=>{upHtml+=`<div class="row-item"><div class="av" style="width:36px;height:36px;background:var(--blue-bg);color:var(--blue);font-size:11px">${ini(v.cliente)}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.cliente)}</div><div style="font-size:11px;color:var(--muted)">${esc(v.atividade)}</div></div><span style="font-size:11px;color:var(--muted);flex-shrink:0">${fd(v.data)}</span></div>`;});}
  let recHtml=`<div class="sec">✅ Últimas realizadas</div>`;
  recent.forEach(v=>{recHtml+=`<div class="row-item"><div class="av" style="width:36px;height:36px;background:var(--grbg);color:var(--grc);font-size:11px">${ini(v.cliente)}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.cliente)}</div><div style="font-size:11px;color:var(--muted)">${esc(v.atividade)}</div></div><span style="font-size:11px;color:var(--muted);flex-shrink:0">${fd(v.data)}</span></div>`;});

  // Clientes em silêncio
  const silentClients=clients.filter(c=>{const d=diasSemVisita(c.nome);return d!==null&&d>=30;}).sort((a,b)=>(diasSemVisita(b.nome)||0)-(diasSemVisita(a.nome)||0)).slice(0,4);
  let silentHtml='';
  if(silentClients.length){
    silentHtml=`<div class="sec">😴 Clientes em silêncio (30+ dias)</div>`;
    silentClients.forEach(c=>{const d=diasSemVisita(c.nome);silentHtml+=`<div class="silent-card" onclick="goTo('clients')"><div class="av" style="width:34px;height:34px;background:var(--amb-bg);color:var(--amb);font-size:11px">${ini(c.nome)}</div><div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nome)}</div><div style="font-size:11px;color:var(--amb)">${d} dias sem visita</div></div><button onclick="event.stopPropagation();newVisitFor('${esc(c.nome)}')" style="font-size:11px;padding:4px 9px;border-radius:6px;border:none;background:var(--amb);color:#fff;cursor:pointer;flex-shrink:0;">+ Visita</button></div>`;});
  }

  document.getElementById('s-dash').innerHTML=isD()?`
    <div class="dash-grid">
      <div>
        <div style="font-size:22px;font-weight:700;color:var(--txt);margin-bottom:3px">Bom dia, Andrei! 👋</div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:18px">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
        ${notifHtml}${kpiHtml}${chartCard}
      </div>
      <div>${upHtml}${recHtml}${silentHtml}</div>
    </div>
  `:`
    <div style="margin-bottom:14px"><div style="font-size:11px;color:var(--muted)">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><div style="font-size:20px;font-weight:700;color:var(--txt)">Dashboard</div></div>
    ${notifHtml}${kpiHtml}${chartCard}${upHtml}${recHtml}${silentHtml}`;
}

/* ══ VISITS ══════════════════════════════════════════════════ */
function renderVisits(){
  const sf=document.getElementById('v-sf');
  if(!sf.innerHTML){['Todas',...STS].forEach(s=>{const b=document.createElement('button');b.className='fpill'+(s==='Todas'?' on':'');b.textContent=s;b.dataset.s=s;b.onclick=()=>{fsf=s;document.querySelectorAll('#v-sf .fpill').forEach(x=>x.classList.toggle('on',x.dataset.s===s));renderVisits();};sf.appendChild(b);});}
  const ff=document.getElementById('v-ff');
  if(!ff.innerHTML){['Todos',...EMPS].forEach(e=>{const b=document.createElement('button');b.className='fpill'+(e==='Todos'?' on':'');b.textContent=e;b.dataset.e=e;b.onclick=()=>{fff=e;document.querySelectorAll('#v-ff .fpill').forEach(x=>x.classList.toggle('on',x.dataset.e===e));renderVisits();};ff.appendChild(b);});}
  const q=(document.getElementById('v-search').value||'').toLowerCase();
  const df=document.getElementById('v-df').value,dt=document.getElementById('v-dt').value;
  const sortBy=(document.getElementById('v-sort')||{value:'date-desc'}).value;
  const sorters={
    'date-desc':(a,b)=>b.data.localeCompare(a.data),
    'date-asc':(a,b)=>a.data.localeCompare(b.data),
    'client-az':(a,b)=>a.cliente.localeCompare(b.cliente),
    'client-za':(a,b)=>b.cliente.localeCompare(a.cliente),
  };
  const filtered=visits.filter(v=>(fsf==='Todas'||v.status===fsf)&&(fff==='Todos'||v.funcionario===fff)&&(!q||v.cliente.toLowerCase().includes(q)||v.atividade.toLowerCase().includes(q)||(v.obs||'').toLowerCase().includes(q))&&(!df||v.data>=df)&&(!dt||v.data<=dt)).sort(sorters[sortBy]||sorters['date-desc']);
  const body=document.getElementById('v-body');
  if(isD()){
    const byCols={};STS.forEach(s=>byCols[s]=[]);
    filtered.forEach(v=>byCols[v.status]&&byCols[v.status].push(v));
    const cc={Agendada:{hdr:'var(--blue)',cnt:'var(--blue-bg)',b:'var(--blue-b)'},Realizada:{hdr:'var(--grc)',cnt:'var(--grbg)',b:'var(--grbb)'},Cancelada:{hdr:'var(--red)',cnt:'var(--red-bg)',b:'var(--red-b)'},Atrasada:{hdr:'var(--amb)',cnt:'var(--amb-bg)',b:'var(--amb-b)'}};
    let html=`<div style="padding:8px 28px 6px;font-size:12px;color:var(--muted)">${filtered.length} visita(s)</div><div class="kanban-board" style="padding:0 28px 28px;">`;
    STS.forEach(s=>{
      const c=cc[s],cols=byCols[s];
      html+=`<div class="kb-col"><div class="kb-col-header"><span class="kb-col-title">${s}</span><span class="kb-count" style="background:${c.cnt};color:${c.hdr};border-color:${c.b}">${cols.length}</span></div>`;
      if(!cols.length)html+=`<div style="font-size:12px;color:var(--muted);text-align:center;padding:20px 0">Nenhuma</div>`;
      cols.forEach(v=>{
        const obsH=v.obs?`<div class="kb-obs">${esc(v.obs)}</div>`:'';
        const qaBtn=v.status!=='Realizada'?`<button class="qa-btn" onclick="quickRealizar(${v.id},event)" title="Marcar como Realizada">✓ Realizada</button>`:'';
        const isOverdue=v.status==='Agendada'&&v.data<td();
        const overdueTag=isOverdue?`<span class="overdue-tag">Vencida</span>`:'';
        html+=`<div class="kb-card${isOverdue?' overdue':''}" onclick="editVisit(${v.id})">
          <div class="kb-client">${esc(v.cliente)}${overdueTag}</div>
          <div class="kb-act">${esc(v.atividade)}</div>
          ${obsH}
          <div class="kb-meta">${qaBtn}<span style="font-size:10px;color:${isOverdue?'var(--amb)':'var(--muted)'};font-weight:${isOverdue?'600':'400'}">${fd(v.data)}</span></div>
        </div>`;
      });
      html+=`</div>`;
    });
    html+=`</div>`;
    body.innerHTML=html;
  } else {
    let html=`<div style="font-size:11px;color:var(--muted);padding:0 0 8px">${filtered.length} visita(s)</div>`;
    if(!filtered.length)html+='<div class="empty">Nenhuma visita encontrada</div>';
    else filtered.forEach(v=>{
      const obsH=v.obs?`<div style="font-size:11px;color:var(--muted);margin-top:7px;padding:5px 8px;background:var(--inp);border-radius:6px;border-left:2px solid var(--gm)">${esc(v.obs)}</div>`:'';
      html+=`<div class="mvisit-card s-${v.status}" onclick="editVisit(${v.id})">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:8px"><div style="font-weight:500;font-size:14px;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.cliente)}</div><span class="badge badge-${v.status}">${v.status}</span></div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px">${esc(v.atividade)}</div>
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:11px;color:var(--muted)">${esc(v.funcionario)}</span>
          <span style="font-size:11px;color:var(--muted)">${fd(v.data)}</span>
        </div>
        ${obsH}
        ${v.status!=='Realizada'?`<div style="margin-top:8px"><button class="qa-btn" style="font-size:11px;padding:4px 10px;" onclick="quickRealizar(${v.id},event)">✓ Marcar como Realizada</button></div>`:''}
      </div>`;
    });
    body.innerHTML=`<div class="lwrap">${html}</div>`;
  }
}

/* ══ VISIT FORM ══════════════════════════════════════════════ */
function renderVF(v,isDup=false){
  evId=isDup?null:v?v.id:null;
  cfs=v?v.status:'Agendada';
  const isE=!!v&&!isDup;
  const co=clients.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option${v&&v.cliente===c.nome?' selected':''}>${esc(c.nome)}</option>`).join('');
  const ao=ACTS.map(a=>`<option${v&&v.atividade===a?' selected':''}>${esc(a)}</option>`).join('');
  const eo=EMPS.map(e=>`<option${v&&v.funcionario===e?' selected':''}>${esc(e)}</option>`).join('');
  const ph=STS.map(s=>`<button type="button" class="spill${s===cfs?' a-'+s:''}" onclick="setFS('${s}')">${s}</button>`).join('');
  const w=isD()?'d-form-wrap':'';
  document.getElementById('s-form').innerHTML=`
    <div class="${w}">
      <div style="font-size:18px;font-weight:600;color:var(--txt);margin-bottom:16px">${isDup?'Duplicar Visita':isE?'Editar Visita':'Nova Visita'}</div>
      <label class="lbl">Data</label><input type="date" id="f-data" class="inp" value="${isDup?td():v?v.data:td()}">
      <label class="lbl">Funcionário</label><select id="f-func" class="inp">${eo}</select>
      <label class="lbl">Cliente</label><select id="f-client" class="inp">${co}</select>
      <label class="lbl">Atividade</label><select id="f-atv" class="inp">${ao}</select>
      <label class="lbl">Status</label><div class="spills" id="form-pills">${ph}</div>
      <label class="lbl">Observações</label><textarea id="f-obs" class="inp" rows="3" placeholder="Anotações sobre a visita...">${esc(v?v.obs:'')}</textarea>
      <div style="margin-top:20px">
        <button type="button" class="btn btn-primary" onclick="saveVisit()">${isE?'Salvar Alterações':isDup?'Registrar Cópia':'Registrar Visita'}</button>
        ${isE?`<button type="button" class="btn btn-dup" onclick="renderVF(visits.find(x=>x.id===${v.id}),true)">⧉ Duplicar esta visita</button>`:''}
        ${isE?`<button type="button" class="btn btn-danger" onclick="delVisit()">Excluir Visita</button>`:''}
        <button type="button" class="btn btn-ghost" onclick="goTo('visits')">Cancelar</button>
      </div>
    </div>`;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-form').classList.add('active');
  document.querySelectorAll('[data-tab]').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('[data-tab="form"]').forEach(b=>b.classList.add('active'));
  const pt=document.getElementById('d-page-title');if(pt)pt.textContent=isE?'Editar Visita':'Nova Visita';
  setTimeout(()=>document.getElementById('f-data')?.focus(),100);
}
function setFS(s){cfs=s;document.getElementById('form-pills').innerHTML=STS.map(st=>`<button type="button" class="spill${st===s?' a-'+st:''}" onclick="setFS('${st}')">${st}</button>`).join('');}
function newVisit(){evId=null;renderVF(null);}
function editVisit(id){renderVF(visits.find(x=>x.id===id));}
function saveVisit(){
  const data=document.getElementById('f-data').value;
  const funcionario=document.getElementById('f-func').value;
  const cliente=document.getElementById('f-client').value;
  const atividade=document.getElementById('f-atv').value;
  const obs=document.getElementById('f-obs').value;
  if(!data||!cliente){toast('Preencha a data e o cliente','err');return;}
  if(evId)visits=visits.map(v=>v.id===evId?{...v,data,funcionario,cliente,atividade,status:cfs,obs}:v);
  else visits.push({id:nvi(),data,funcionario,cliente,atividade,status:cfs,obs});
  svFB();
  toast(evId?'Visita atualizada!':'Visita registrada!','ok');
  evId=null;goTo('visits');updSbMonth();
}
function delVisit(){
  modalConfirm('Excluir visita','Tem certeza? Esta ação não pode ser desfeita.',()=>{
    visits=visits.filter(v=>v.id!==evId);
    svFB();toast('Visita excluída','warn');evId=null;goTo('visits');updSbMonth();
  });
}

/* ══ TOGGLE ATIVO/INATIVO ════════════════════════════════════ */
let cAtivoFilter='ativos'; // 'todos' | 'ativos' | 'inativos'
function toggleAtivo(id,ev){
  ev&&ev.stopPropagation();
  const c=clients.find(x=>x.id===id);if(!c)return;
  const novoEstado=c.ativo===false?true:false;
  // Atualiza localmente primeiro (resposta imediata na tela)
  clients=clients.map(x=>x.id===id?{...x,ativo:novoEstado}:x);
  // Salva apenas o campo 'ativo' deste cliente (atômico — evita sobrescrita)
  setSyncs('sy');
  db.ref('clients/'+id+'/ativo').set(novoEstado)
    .then(()=>setSyncs('ok'))
    .catch(()=>{setSyncs('er');toast('Erro ao salvar — verifique a conexão','err');});
  toast(novoEstado?`${c.nome} marcado como Ativo`:`${c.nome} marcado como Inativo`,novoEstado?'ok':'warn');
  renderClients();
}

function renderClients(){
  // Build ativo filter pills once
  const af=document.getElementById('c-ativo-filters');
  if(af&&!af.innerHTML){
    [['ativos','● Ativos'],['todos','Todos'],['inativos','○ Inativos']].forEach(([val,lbl])=>{
      const b=document.createElement('button');
      b.className='fpill'+(val===cAtivoFilter?' on':'');
      b.textContent=lbl;b.dataset.v=val;
      b.onclick=()=>{cAtivoFilter=val;document.querySelectorAll('#c-ativo-filters .fpill').forEach(x=>x.classList.toggle('on',x.dataset.v===val));renderClients();};
      af.appendChild(b);
    });
  }

  const q=(document.getElementById('c-search').value||'').toLowerCase();
  const allFiltered=clients.filter(c=>!q||c.nome.toLowerCase().includes(q)||c.responsavel.toLowerCase().includes(q));
  const filtered=allFiltered.filter(c=>{
    const isAtivo=c.ativo!==false;
    if(cAtivoFilter==='ativos')return isAtivo;
    if(cAtivoFilter==='inativos')return!isAtivo;
    return true;
  }).sort((a,b)=>{
    // Ativos primeiro, depois por nome
    const aA=a.ativo!==false,bA=b.ativo!==false;
    if(aA&&!bA)return-1;if(!aA&&bA)return 1;
    return a.nome.localeCompare(b.nome);
  });
  const ativos=clients.filter(c=>c.ativo!==false).length;
  const inativos=clients.length-ativos;
  document.getElementById('c-count').textContent=`${filtered.length} exibido(s) · ${ativos} ativo(s) · ${inativos} inativo(s)`;
  const body=document.getElementById('c-body');
  if(isD()){
    let html='<div class="c-grid">';
    filtered.forEach(c=>{
      const isAtivo=c.ativo!==false;
      const hasWA=c.telefone&&c.telefone.replace(/\D/g,'').length>=10;
      const vCount=visits.filter(v=>v.cliente===c.nome).length;
      const nextV=visits.filter(v=>v.cliente===c.nome&&v.data>=td()&&v.status==='Agendada').sort((a,b)=>a.data.localeCompare(b.data))[0];
      html+=`<div class="c-card${isAtivo?'':' inativo'}" onclick="showClient(${c.id})">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
          <div class="av" style="width:42px;height:42px;background:${isAtivo?'var(--gl)':'var(--inp)'};color:${isAtivo?'var(--gd)':'var(--muted)'};font-size:14px">${ini(c.nome)}</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nome)}</div>
            <div style="font-size:12px;color:var(--muted)">${esc(c.responsavel||'—')}</div>
          </div>
          <button class="ativo-pill ${isAtivo?'on':'off'}" onclick="toggleAtivo(${c.id},event)" title="${isAtivo?'Marcar como Inativo':'Marcar como Ativo'}">${isAtivo?'● Ativo':'○ Inativo'}</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px">
          ${diasBadge(c.nome)}
          ${nextV?`<span style="font-size:10px;color:var(--blue)">📅 ${fd(nextV.data)}</span>`:`<span style="font-size:10px;color:var(--muted)">${vCount} visita(s)</span>`}
          ${hasWA?`<span onclick="event.stopPropagation();openWA('${esc(c.telefone)}')" style="font-size:10px;color:#25D366;cursor:pointer;font-weight:600">WA</span>`:''}
        </div>
        ${c.obs?`<div style="font-size:11px;color:var(--muted);margin-top:7px;padding:4px 8px;background:var(--inp);border-radius:6px">${esc(c.obs)}</div>`:''}
      </div>`;
    });
    html+='</div>';
    body.innerHTML=html;
  } else {
    let html='';
    filtered.forEach(c=>{
      const isAtivo=c.ativo!==false;
      const hasWA=c.telefone&&c.telefone.replace(/\D/g,'').length>=10;
      html+=`<div class="row-item${isAtivo?'':' inativo'}" onclick="showClient(${c.id})">
        <div class="av" style="width:40px;height:40px;background:${isAtivo?'var(--gl)':'var(--inp)'};color:${isAtivo?'var(--gd)':'var(--muted)'};font-size:12px">${ini(c.nome)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:14px;font-weight:500;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.nome)}</div>
          <div style="display:flex;align-items:center;gap:6px;margin-top:2px">${diasBadge(c.nome)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <button class="ativo-pill ${isAtivo?'on':'off'}" onclick="toggleAtivo(${c.id},event)">${isAtivo?'● Ativo':'○ Inativo'}</button>
          ${hasWA?`<span onclick="event.stopPropagation();openWA('${esc(c.telefone)}')" style="font-size:11px;color:#25D366;font-weight:600">WA</span>`:''}
          <span style="color:var(--muted);font-size:18px">›</span>
        </div>
      </div>`;
    });
    body.innerHTML=`<div style="padding:0 16px">${html||'<div class="empty">Nenhum cliente encontrado</div>'}</div>`;
  }
}

function newVisitFor(clienteNome){

function newClient(){ecId=null;renderCF(null);}
function editClient(id){ecId=id;renderCF(clients.find(x=>x.id===id));}
function renderCF(c){

  const w=isD()?'d-form-wrap':'';
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));

  document.getElementById('s-cform').innerHTML=`
    <div class="${w}">
      <button class="back-btn" onclick="goTo('clients')">← Voltar para Clientes</button>

      <div style="font-size:12px;color:var(--muted);margin-bottom:16px">Preencha os dados da empresa</div>
      <label class="lbl">Nome da empresa <span style="color:var(--red)">*</span></label>
      <input type="text" id="cf-nome" class="inp" placeholder="Ex: Vale S11D" value="${esc(c?c.nome:'')}">
      <label class="lbl">Responsável / Contato</label>

      <input type="email" id="cf-email" class="inp" placeholder="Ex: contato@empresa.com" value="${esc(c?c.email:'')}">
      <label class="lbl">Observação (cargo, setor...)</label>
      <input type="text" id="cf-obs" class="inp" placeholder="Ex: Comprador, Engenheiro..." value="${esc(c?c.obs:'')}">
      <div style="margin-top:20px">
        <button type="button" class="btn btn-primary" onclick="saveClient()">${isE?'Salvar Alterações':'Cadastrar Empresa'}</button>
        ${isE?`<button type="button" class="btn btn-danger" onclick="delClient()">Excluir Empresa</button>`:''}
        <button type="button" class="btn btn-ghost" onclick="goTo('clients')">Cancelar</button>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('cf-nome')?.focus(),100);
}
function saveClient(){
  const nome=(document.getElementById('cf-nome').value||'').trim();
  if(!nome){toast('O nome da empresa é obrigatório','err');return;}
  const existing=clients.find(c=>c.id===ecId);
  const newId=ecId||nci();
  const obj={id:newId,nome,responsavel:(document.getElementById('cf-resp').value||'').trim(),telefone:(document.getElementById('cf-tel').value||'').trim(),email:(document.getElementById('cf-email').value||'').trim(),obs:(document.getElementById('cf-obs').value||'').trim(),ativo:existing?existing.ativo!==false:true};
  // Atualiza localmente
  if(ecId)clients=clients.map(c=>c.id===ecId?obj:c);else clients.push(obj);
  // Write atômico — só este cliente (evita sobrescrever coleção inteira)
  setSyncs('sy');
  db.ref('clients/'+newId).set(obj)
    .then(()=>{setSyncs('ok');})
    .catch(()=>{setSyncs('er');toast('Erro ao salvar — verifique conexão','err');});
  toast(ecId?'Empresa atualizada!':'Empresa cadastrada!','ok');
  ecId=null;
  goTo('clients');
}
function delClient(){
  const idToDel=ecId;
  modalConfirm('Excluir empresa','As visitas desta empresa não serão excluídas.',()=>{
    clients=clients.filter(c=>c.id!==idToDel);
    // Remove atômico — só este cliente
    setSyncs('sy');
    db.ref('clients/'+idToDel).remove()
      .then(()=>setSyncs('ok'))
      .catch(()=>{setSyncs('er');toast('Erro ao excluir','err');});
    toast('Empresa excluída','warn');ecId=null;goTo('clients');
  });
}

/* ══ REPORT ═════════════════════════════════════════════════ */
function renderReport(){
  const anos=[...new Set(visits.map(v=>v.data.slice(0,4)))].sort((a,b)=>b-a);
  if(!repAno&&anos.length)repAno=anos[0];
  const filtered=visits.filter(v=>{const yr=v.data.slice(0,4)===repAno;const mi=MESES.indexOf(repMes);const mo=repMes==='Todos'||v.data.slice(5,7)===String(mi+1).padStart(2,'0');return yr&&mo;}).sort((a,b)=>b.data.localeCompare(a.data));
  const byS={};filtered.forEach(v=>byS[v.status]=(byS[v.status]||0)+1);
  const byC={};filtered.forEach(v=>byC[v.cliente]=(byC[v.cliente]||0)+1);
  const topC=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const taxa=filtered.length>0?Math.round(((byS.Realizada||0)/filtered.length)*100):0;
  // Activity breakdown
  const byA={};filtered.forEach(v=>byA[v.atividade]=(byA[v.atividade]||0)+1);
  const topA=Object.entries(byA).sort((a,b)=>b[1]-a[1]);
  const maxA=topA.length?topA[0][1]:1;
  const actH=topA.map(([nome,qt])=>{
    const pct=Math.round((qt/Math.max(filtered.length,1))*100);
    const barPct=Math.round((qt/maxA)*100);
    return`<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:12px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%">${esc(nome)}</span><span style="font-size:11px;color:var(--muted)">${qt} (${pct}%)</span></div><div class="prog-wrap"><div class="prog-bar" style="width:${barPct}%;background:var(--blue)"></div></div></div>`;
  }).join('');
  const anoOpts=anos.map(a=>`<option${a===repAno?' selected':''}>${a}</option>`).join('');
  const mesOpts=['Todos',...MESES].map(m=>`<option${m===repMes?' selected':''}>${m}</option>`).join('');
  const stH=[['Agendada','var(--blue-bg)','var(--blue)','var(--blue-b)'],['Realizada','var(--grbg)','var(--grc)','var(--grbb)'],['Cancelada','var(--red-bg)','var(--red)','var(--red-b)'],['Atrasada','var(--amb-bg)','var(--amb)','var(--amb-b)']].map(([s,bg,c,b])=>`<div style="background:${bg};border:1px solid ${b};border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center"><span style="font-size:12px;color:${c}">${s}</span><span style="font-size:22px;font-weight:700;color:${c}">${byS[s]||0}</span></div>`).join('');
  const topH=topC.map(([nome,qt])=>{const pct=Math.round((qt/filtered.length)*100);return`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:3px"><span style="font-size:13px;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${esc(nome)}</span><span style="font-size:12px;color:var(--muted)">${qt} (${pct}%)</span></div><div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div></div>`;}).join('');
  const w=isD()?'style="max-width:700px"':'';
  document.getElementById('s-report').innerHTML=`
    <div ${w}>
      <div style="font-size:20px;font-weight:600;color:var(--txt);margin-bottom:16px">Relatório de Visitas</div>
      <div style="display:flex;gap:10px;margin-bottom:18px">
        <select class="inp" style="flex:1" onchange="repAno=this.value;renderReport()">${anoOpts}</select>
        <select class="inp" style="flex:1" onchange="repMes=this.value;renderReport()">${mesOpts}</select>
      </div>
      <div class="card" style="margin-bottom:8px;background:var(--grbg);border-color:var(--grbb)">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:13px;color:var(--grc)">Taxa de realização</div><div style="font-size:36px;font-weight:700;color:var(--grc)">${taxa}%</div></div>
          <div style="text-align:right"><div style="font-size:12px;color:var(--grc)">${filtered.length} visitas no período</div></div>
        </div>
        <div class="prog-wrap" style="margin-top:10px"><div class="prog-bar" style="width:${taxa}%"></div></div>
      </div>
      <div class="card" style="margin-bottom:14px">
        <div style="font-size:13px;font-weight:500;color:var(--txt);margin-bottom:12px">Por status</div>
        <div style="display:grid;grid-template-columns:repeat(${isD()?4:2},1fr);gap:8px">${stH}</div>
      </div>
      ${topC.length?`<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:500;color:var(--txt);margin-bottom:12px">Top clientes no período</div>${topH}</div>`:''}
      ${actH?`<div class="card" style="margin-bottom:16px"><div style="font-size:13px;font-weight:500;color:var(--txt);margin-bottom:12px">Por tipo de atividade</div>${actH}</div>`:''}
      <button class="btn btn-exp" onclick="exportCSV()">↓ &nbsp;Exportar CSV (${filtered.length} visitas)</button>
    </div>`;
}
function exportCSV(){
  const anos=[...new Set(visits.map(v=>v.data.slice(0,4)))].sort((a,b)=>b-a);
  if(!repAno&&anos.length)repAno=anos[0];
  const filtered=visits.filter(v=>{const yr=v.data.slice(0,4)===repAno;const mi=MESES.indexOf(repMes);const mo=repMes==='Todos'||v.data.slice(5,7)===String(mi+1).padStart(2,'0');return yr&&mo;}).sort((a,b)=>b.data.localeCompare(a.data));
  const h='Data,Funcionário,Cliente,Atividade,Status,Observações\n';
  const r=filtered.map(v=>`${fd(v.data)},"${v.funcionario}","${v.cliente}","${v.atividade}",${v.status},"${(v.obs||'').replace(/"/g,"'")}"`).join('\n');
  const blob=new Blob(['\uFEFF'+h+r],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`visitas_${repAno}${repMes!=='Todos'?'_'+repMes:''}.csv`;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  toast(`CSV com ${filtered.length} visitas exportado!`,'ok');
}

function openWA(tel){window.open(`https://wa.me/55${tel.replace(/\D/g,'')}`, '_blank');}

let resT;window.addEventListener('resize',()=>{clearTimeout(resT);resT=setTimeout(()=>{if(!fbOk)return;const dt=document.getElementById('d-topbar');if(dt)dt.style.display=isD()?'flex':'none';if(curScreen==='dash')renderDash();if(curScreen==='visits')renderVisits();if(curScreen==='clients')renderClients();},220);});

/* ══ KEYBOARD SHORTCUTS (desktop) ════════════════════════════ */
document.addEventListener('keydown',e=>{
  if(!fbOk||!isD())return;
  // Don't fire when typing in inputs
  const tag=(e.target.tagName||'').toLowerCase();
  if(['input','textarea','select'].includes(tag))return;
  if(e.key==='n'||e.key==='N'){e.preventDefault();newVisit();}
  else if(e.key==='/')  {e.preventDefault();const s=document.getElementById('v-search');if(s){goTo('visits');setTimeout(()=>s.focus(),80);}}
  else if(e.key==='1')  goTo('dash');
  else if(e.key==='2')  goTo('visits');
  else if(e.key==='3')  goTo('report');
  else if(e.key==='4')  goTo('clients');
  else if(e.key==='Escape'){if(curScreen==='form'||curScreen==='cform')goTo('visits');}
});

initApp();
</script>
